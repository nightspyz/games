<!-- Lantern Tide v3.3 -->
<style>

<body>
<div id="hint">WASD walk · drag look · Shift run · E pick up / put down · Space: draw, light a firework, drone take-off/land · drone: WASD fly, R/F up/down, drag to steer</div>
<div id="pip" hidden><div></div></div>
<div id="gmenu" hidden></div>
<button id="vr">Enter VR</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Lantern Tide v3.3: a quiet WebXR walk along an island beach on the Coastline ocean (Gerstner swell, breaking waves and
// swash, foam, caustics, volumetric sky, rain and lightning) through a full day and night, with Chinese festival
// lanterns on the water and in the air. The wave maths is mirrored in JS so floating things ride the real surface.
(() => {
"use strict";
const $ = (id) => document.getElementById(id);

// ===== Helpers =====
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));

// ===== Renderer, scene, rig =====
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType("local-floor");
if (renderer.xr.setFramebufferScaleFactor) renderer.xr.setFramebufferScaleFactor(0.9);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb8dcf3, 120, 900);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 12000);
const rig = new THREE.Group(); // everything that is "you": the headset's camera and both hands
scene.add(rig);
rig.add(camera);
camera.position.set(0, 1.65, 0);

// ===== Sky, clouds and time-of-day uniforms (shared by sky and water) =====
const shared = {
  uTop: { value: new THREE.Color() },
  uHorizon: { value: new THREE.Color() },
  uSunDir: { value: new THREE.Vector3(0, 1, 0) },
  uSunColor: { value: new THREE.Color() },
  uSunset: { value: 0 },
  uSunVis: { value: 1 },
  uStars: { value: 0 },
  uTime: { value: 0 },
  uCloudCover: { value: 0.2 },
  uCloudDark: { value: 0 },
  uCloudOffset: { value: new THREE.Vector2() },
  uLightLevel: { value: 1 },
  uAurora: { value: 0 },
  uFog: { value: 0 },
  uRays: { value: 0 },
};

const SKY_GLSL = /* glsl */ `
  uniform vec3 uTop;
  uniform vec3 uHorizon;
  uniform vec3 uSunDir;
  uniform vec3 uSunColor;
  uniform float uSunset;
  uniform float uSunVis;
  uniform float uStars;
  uniform float uTime;

  vec3 skyColor(vec3 d) {
    float h = clamp(d.y, 0.0, 1.0);
    vec3 col = mix(uHorizon, uTop, pow(h, 0.45));
    vec2 dh = normalize(d.xz + vec2(1e-4));
    vec2 sh = normalize(uSunDir.xz + vec2(1e-4));
    float az = max(dot(dh, sh), 0.0); // 1 toward the sun
    float glow = pow(az, 6.0) * pow(1.0 - h, 5.0);
    col += uSunColor * glow * uSunset * 0.7;
    // Sunset bands: gold on the horizon, then red, magenta and violet climbing the sky, strongest toward the sun
    vec3 band = mix(vec3(1.0, 0.6, 0.16), vec3(0.92, 0.13, 0.12), smoothstep(0.01, 0.07, h));
    band = mix(band, vec3(0.74, 0.14, 0.42), smoothstep(0.06, 0.2, h));
    band = mix(band, vec3(0.34, 0.14, 0.54), smoothstep(0.18, 0.45, h));
    float reach = 1.0 - smoothstep(0.3, 0.8, h);
    col = mix(col, band, clamp(uSunset * reach * (0.3 + 0.7 * pow(az, 1.4)), 0.0, 0.93));
    // the pink and purple "belt of Venus" opposite the sun
    float anti = pow(max(-dot(dh, sh), 0.0), 2.0);
    vec3 belt = mix(vec3(0.9, 0.5, 0.62), vec3(0.38, 0.24, 0.56), smoothstep(0.02, 0.22, h));
    col = mix(col, belt, uSunset * anti * 0.6 * (1.0 - smoothstep(0.0, 0.3, h)));
    return col;
  }
`;

const NOISE_GLSL = /* glsl */ `
  // A hash without sin(): sin() of large world coordinates loses precision on GPUs
  float hash(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
  }
  float vnoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
  }
  float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    for (int i = 0; i < 5; i++) {
      v += a * vnoise(p);
      p = p * 2.03 + vec2(17.1, 9.2);
      a *= 0.5;
    }
    return v;
  }
`;

const CLOUD_BOTTOM = 450;
const CLOUD_TOP = 1150;
const CLOUD_SHADOW_HEIGHT = 650;

const CLOUD_GLSL = /* glsl */ `
  uniform float uCloudCover;
  uniform vec2 uCloudOffset;
  const float CLOUD_BOTTOM = ${CLOUD_BOTTOM.toFixed(1)};
  const float CLOUD_TOP = ${CLOUD_TOP.toFixed(1)};

  float hash3(vec3 p) {
    p = fract(p * 0.1031);
    p += dot(p, p.zyx + 31.32);
    return fract((p.x + p.y) * p.z);
  }
  float noise3(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    vec3 u = f * f * (3.0 - 2.0 * f);
    float a = mix(hash3(i), hash3(i + vec3(1.0, 0.0, 0.0)), u.x);
    float b = mix(hash3(i + vec3(0.0, 1.0, 0.0)), hash3(i + vec3(1.0, 1.0, 0.0)), u.x);
    float c = mix(hash3(i + vec3(0.0, 0.0, 1.0)), hash3(i + vec3(1.0, 0.0, 1.0)), u.x);
    float d = mix(hash3(i + vec3(0.0, 1.0, 1.0)), hash3(i + vec3(1.0, 1.0, 1.0)), u.x);
    return mix(mix(a, b, u.y), mix(c, d, u.y), u.z);
  }
  float fbm3(vec3 p) {
    float v = 0.0;
    float a = 0.5;
    for (int i = 0; i < 4; i++) {
      v += a * noise3(p);
      p = p * 2.02 + vec3(17.1, 9.2, 4.7);
      a *= 0.5;
    }
    return v;
  }
  float cloudDensity(vec3 p) {
    float h = (p.y - CLOUD_BOTTOM) / (CLOUD_TOP - CLOUD_BOTTOM);
    if (h < 0.0 || h > 1.0) return 0.0;
    vec2 xz = p.xz - uCloudOffset;
    // a weather map: clouds gather into banks with clear gaps between them
    float bank = noise3(vec3(xz * 0.00032, 3.0)) * 0.7 + noise3(vec3(xz * 0.0009 + 11.0, 7.0)) * 0.3;
    float cov = clamp(uCloudCover + (bank - 0.5) * 0.9, 0.0, 1.0);
    // billowy cumulus: a low-frequency base shape, with fine detail eating into its edges
    vec3 q = vec3(xz.x * 0.0017, p.y * 0.0026, xz.y * 0.0021);
    float base = fbm3(q);
    float detail = fbm3(q * 3.3 + vec3(13.0, 2.0, 5.0));
    // flat bottoms; tops climb higher in the thick banks and round off
    float top = mix(0.4, 1.0, cov);
    float hm = smoothstep(0.0, 0.1, h) * (1.0 - smoothstep(top - 0.4, top, h));
    float thr = mix(0.6, 0.3, cov) + (1.0 - hm) * 0.25;
    float s = base - thr - (1.0 - detail) * 0.1 * (0.3 + 0.7 * h);
    return max(s * 5.5, 0.0);
  }
  // 1 = full sun, lower = under a cloud
  float cloudShadow(vec3 wp, vec3 sunDir) {
    float s = max(sunDir.y, 0.08);
    vec3 p = wp + sunDir / s * (${CLOUD_SHADOW_HEIGHT.toFixed(1)} - wp.y);
    return exp(-cloudDensity(vec3(p.x, ${CLOUD_SHADOW_HEIGHT.toFixed(1)}, p.z)) * 1.5);
  }
`;

// JavaScript copy of cloudDensity, used to shade the raft and the lighthouse
const fract = (x) => x - Math.floor(x);
function cloudHash3(x, y, z) {
  x = fract(x * 0.1031);
  y = fract(y * 0.1031);
  z = fract(z * 0.1031);
  const d = x * (z + 31.32) + y * (y + 31.32) + z * (x + 31.32);
  x += d;
  y += d;
  z += d;
  return fract((x + y) * z);
}
function cloudNoise3(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy), uz = fz * fz * (3 - 2 * fz);
  const a = lerp(cloudHash3(ix, iy, iz), cloudHash3(ix + 1, iy, iz), ux);
  const b = lerp(cloudHash3(ix, iy + 1, iz), cloudHash3(ix + 1, iy + 1, iz), ux);
  const c = lerp(cloudHash3(ix, iy, iz + 1), cloudHash3(ix + 1, iy, iz + 1), ux);
  const d = lerp(cloudHash3(ix, iy + 1, iz + 1), cloudHash3(ix + 1, iy + 1, iz + 1), ux);
  return lerp(lerp(a, b, uy), lerp(c, d, uy), uz);
}
function cloudFbm3(x, y, z) {
  let v = 0, a = 0.5;
  for (let i = 0; i < 4; i++) {
    v += a * cloudNoise3(x, y, z);
    x = x * 2.02 + 17.1;
    y = y * 2.02 + 9.2;
    z = z * 2.02 + 4.7;
    a *= 0.5;
  }
  return v;
}
function cloudDensityJS(x, y, z, cover, offset) {
  const h = (y - CLOUD_BOTTOM) / (CLOUD_TOP - CLOUD_BOTTOM);
  if (h < 0 || h > 1) return 0;
  const px = x - offset.x, pz = z - offset.y;
  const bank = cloudNoise3(px * 0.00032, 0, pz * 0.00032 + 0) * 0.7 + cloudNoise3(px * 0.0009 + 11, 7, pz * 0.0009 + 11) * 0.3;
  const cov = clamp(cover + (bank - 0.5) * 0.9, 0, 1);
  const base = cloudFbm3(px * 0.0017, y * 0.0026, pz * 0.0021);
  const top = lerp(0.4, 1.0, cov);
  const hm = smooth(0, 0.1, h) * (1 - smooth(top - 0.4, top, h));
  const thr = lerp(0.6, 0.3, cov) + (1 - hm) * 0.25;
  return Math.max((base - thr - 0.05 * (0.3 + 0.7 * h)) * 5.5, 0);
}
function cloudShadowJS(x, y, z, sunDir, cover, offset) {
  const s = Math.max(sunDir.y, 0.08);
  const px = x + (sunDir.x / s) * (CLOUD_SHADOW_HEIGHT - y);
  const pz = z + (sunDir.z / s) * (CLOUD_SHADOW_HEIGHT - y);
  return Math.exp(-cloudDensityJS(px, CLOUD_SHADOW_HEIGHT, pz, cover, offset) * 1.5);
}

// ----- Sky dome (follows the camera) -----
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1000, 48, 24),
  new THREE.ShaderMaterial({
    uniforms: shared,
    side: THREE.BackSide,
    depthWrite: false,
    vertexShader: /* glsl */ `
      varying vec3 vDir;
      void main() {
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */ `
      uniform float uFog;
      ${SKY_GLSL}
      ${NOISE_GLSL}
      ${CLOUD_GLSL}
      uniform float uCloudDark;
      uniform float uLightLevel;
      uniform float uAurora;
      uniform float uRays;
      varying vec3 vDir;

      void main() {
        vec3 d = normalize(vDir);
        vec3 col = skyColor(vec3(d.x, max(d.y, 0.0), d.z));

        // Twinkling stars
        vec3 cell = floor(d * 400.0);
        float n = fract(sin(dot(cell, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
        float twinkle = 0.6 + 0.4 * sin(uTime * 2.0 + n * 60.0);
        col += vec3(step(0.9985, n) * twinkle * uStars * smoothstep(0.0, 0.15, d.y));

        // Aurora curtains in the northern sky (-Z)
        if (uAurora > 0.001 && d.y > 0.0) {
          float az = atan(d.x, -d.z);
          float north = 1.0 - smoothstep(0.4, 1.7, abs(az));
          float edge = 0.06 + 0.05 * sin(az * 3.0 + uTime * 0.07);
          float h = d.y;
          float vert = smoothstep(edge, edge + 0.03, h) * (1.0 - smoothstep(edge + 0.04, edge + 0.4, h));
          float curtain = fbm(vec2(az * 4.0 + sin(az * 7.0 + uTime * 0.15) * 0.4, uTime * 0.05));
          curtain = smoothstep(0.35, 0.75, curtain);
          float rays = 0.55 + 0.45 * vnoise(vec2(az * 90.0, uTime * 0.4));
          vec3 ac = mix(vec3(0.15, 1.0, 0.55), vec3(0.65, 0.25, 0.95), smoothstep(edge + 0.08, edge + 0.35, h));
          col += ac * curtain * rays * vert * north * uAurora * 0.9;
        }

        // Moon, opposite the sun
        float md = dot(d, -uSunDir);
        col += vec3(0.85, 0.9, 1.0) * smoothstep(0.99955, 0.9997, md) * uStars;
        col += vec3(0.5, 0.6, 0.8) * pow(max(md, 0.0), 60.0) * 0.15 * uStars;

        // Sun disc and halo
        float sd = max(dot(d, uSunDir), 0.0);
        col += uSunColor * (pow(sd, 9000.0) * 2.5 + pow(sd, 70.0) * 0.1 + pow(sd, 7.0) * 0.03) * uSunVis;

        // Cirrus: thin streaks of ice cloud high above the rest
        if (d.y > 0.03) {
          vec2 cp = d.xz / (d.y + 0.15);
          vec2 shp = vec2(cp.x * 0.6, cp.y * 2.6) + uCloudOffset * 0.00004;
          float cir = fbm(shp * 1.6 + fbm(shp * 0.8) * 1.5);
          float cirrus = smoothstep(0.52, 0.8, cir) * smoothstep(0.03, 0.3, d.y) * (1.0 - 0.7 * uCloudCover);
          vec3 cc = mix(vec3(1.0), uSunColor * vec3(1.0, 0.7, 0.7), uSunset) * (0.12 + 0.88 * uLightLevel) * (1.0 - 0.5 * uCloudDark);
          col = mix(col, cc, cirrus * 0.4 * (1.0 - uFog));
        }
        float cloudAlpha = 0.0;
        // Volumetric clouds: raymarch through the cloud layer, lighting each sample toward the sun
        if (d.y > 0.01) {
          vec3 ro = cameraPosition;
          float t0 = (CLOUD_BOTTOM - ro.y) / d.y;
          float t1 = (CLOUD_TOP - ro.y) / d.y;
          float fade = (1.0 - smoothstep(5000.0, 12000.0, t0)) * smoothstep(0.01, 0.06, d.y);
          if (fade > 0.0) {
            const int STEPS = 20;
            float stepLen = (t1 - t0) / float(STEPS);
            float t = t0 + stepLen * hash(gl_FragCoord.xy);
            float trans = 1.0;
            vec3 acc = vec3(0.0);
            vec3 sunLit = mix(vec3(0.95), uSunColor * vec3(1.0, 0.75, 0.7), 0.95 * uSunset) * uLightLevel * (1.0 - 0.7 * uCloudDark);
            vec3 ambient = (mix(uHorizon, uTop, 0.5) * 0.75 + vec3(0.04) * uLightLevel + vec3(0.3, 0.09, 0.36) * uSunset * 0.35) * (1.0 - 0.5 * uCloudDark);
            float phase = 1.0 + 0.8 * pow(sd, 10.0) * uSunVis; // silver edges toward the sun
            for (int i = 0; i < STEPS; i++) {
              vec3 p = ro + d * t;
              float dens = cloudDensity(p);
              if (dens > 0.001) {
                float ld = cloudDensity(p + uSunDir * 60.0) + cloudDensity(p + uSunDir * 160.0);
                float powder = 1.0 - exp(-dens * stepLen * 0.014); // thin edges catch less light than the dense middle
                vec3 lit = sunLit * exp(-ld * 0.7) * phase * (0.6 + 0.4 * powder) + ambient;
                lit = lit / (1.0 + 0.3 * lit);                    // soft highlights, so sunlit cloud tops don't clip to white
                float a = 1.0 - exp(-dens * stepLen * 0.006);
                acc += trans * a * lit;
                trans *= 1.0 - a;
                if (trans < 0.02) break;
              }
              t += stepLen;
            }
            float alpha = (1.0 - trans) * fade;
            cloudAlpha = alpha;
            col = mix(col, acc / max(1.0 - trans, 1e-3), alpha);
          }
        }

        // God rays: shafts of sunlight streaming through gaps in the clouds. For each pixel, walk the sky from it
        // toward the sun and see how much of that path is open; where it is part open and part cloud, shafts show.
        if (uRays > 0.001) {
          vec3 tgt = normalize(vec3(uSunDir.x, max(uSunDir.y, 0.03), uSunDir.z));
          float cosA = clamp(dot(d, tgt), -1.0, 1.0);
          if (cosA > 0.25) {
            const int RS = 18;
            float jit = hash(gl_FragCoord.xy + 3.1);
            float acc2 = 0.0;
            float wsum = 0.0;
            float w = 1.0;
            for (int i = 0; i < RS; i++) {
              float k = (float(i) + jit) / float(RS);
              vec3 dk = normalize(mix(d, tgt, k));
              dk.y = max(dk.y, 0.03);
              float tm = (0.5 * (CLOUD_BOTTOM + CLOUD_TOP) - cameraPosition.y) / dk.y;
              acc2 += w * exp(-cloudDensity(cameraPosition + dk * tm) * 3.0);
              wsum += w;
              w *= 0.93;
            }
            acc2 /= wsum;
            float shafts = 4.0 * acc2 * (1.0 - acc2);
            float fall = exp(-acos(cosA) * 1.5);
            col += uSunColor * shafts * fall * uRays * 1.7 * (1.0 - 0.5 * cloudAlpha);
          }
        }

        col = mix(col, uHorizon, uFog * 0.95);
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  })
);
sky.renderOrder = -1;
sky.frustumCulled = false;
scene.add(sky);

// ===== The waves (Gerstner swell) =====
// Four swells heading toward the island, which lies to the north (-Z)
const WAVE_DEFS = [
  { ang: 0.0, len: 92, steep: 0.07 },
  { ang: 0.35, len: 54, steep: 0.063 },
  { ang: -0.45, len: 33, steep: 0.049 },
  { ang: 0.9, len: 18, steep: 0.035 },
];
const WAVES = WAVE_DEFS.map((w) => ({ dx: Math.sin(w.ang), dz: -Math.cos(w.ang), k: (Math.PI * 2) / w.len, steep: w.steep, a: w.steep / ((Math.PI * 2) / w.len), c: Math.sqrt(9.8 / ((Math.PI * 2) / w.len)) }));
let waveScale = 1;

// ===== The island, its beach and the breaking waves: one description, in GLSL and in JS =====
const ISL = { x: 0, z: -190, r: 90 };
// The dock: a timber pier from the dunes out to sea, on the west side of the start. The water around it is sheltered
// (a breakwater and a dredged basin) so the boat can lie quietly alongside.
const DOCK_ANG = Math.PI / 2 + 0.2;
const DOCK = { nx: Math.cos(DOCK_ANG), nz: Math.sin(DOCK_ANG), r0: ISL.r - 10, r1: ISL.r + 30, y: 0.85 };
const HARBOR = { x: ISL.x + DOCK.nx * (ISL.r + 22), z: ISL.z + DOCK.nz * (ISL.r + 22), r: 34 };
const harborCalmJS = (x, z) => 1 - 0.85 * Math.exp(-((x - HARBOR.x) ** 2 + (z - HARBOR.z) ** 2) / (HARBOR.r * HARBOR.r));
const harborDredgeJS = (x, z) => 1.7 * Math.exp(-((x - HARBOR.x) ** 2 + (z - HARBOR.z) ** 2) / 196);
const BREAK_L = 24; // wavelength of a breaker, metres
const BREAK_T = 6.5; // its period, seconds

const SHORE_GLSL = /* glsl */ `
  const vec2 ISL_C = vec2(${ISL.x.toFixed(1)}, ${ISL.z.toFixed(1)});
  const float ISL_R = ${ISL.r.toFixed(1)};
  const float BREAK_L = ${BREAK_L.toFixed(1)};
  const float BREAK_T = ${BREAK_T.toFixed(1)};

  const vec2 HARBOR_C = vec2(${HARBOR.x.toFixed(2)}, ${HARBOR.z.toFixed(2)});
  const float HARBOR_R = ${HARBOR.r.toFixed(1)};
  // the sheltered water round the dock, and the dredged basin the boat floats in
  float harborCalm(vec2 p) { vec2 q = p - HARBOR_C; return 1.0 - 0.85 * exp(-dot(q, q) / (HARBOR_R * HARBOR_R)); }
  float harborDredge(vec2 p) { vec2 q = p - HARBOR_C; return 1.7 * exp(-dot(q, q) / 196.0); }

  float shoreDist(vec2 p) { return length(p - ISL_C) - ISL_R; } // metres out to sea (negative on land)
  float shoreCoord(vec2 p) { return -shoreDist(p); }             // grows toward the shore

  // Height of the ground: a sand shelf out to sea that deepens to 45 m, a beach and low dunes on land
  float bedHeight(vec2 p) {
    float d = shoreDist(p);
    if (d > 0.0) return -45.0 * (1.0 - exp(-d * 0.05 / 45.0)) - harborDredge(p);
    float bump = (sin(p.x * 0.11) * sin(p.y * 0.09) * 0.5 + 0.5) * 2.4 * (1.0 - smoothstep(-40.0, 0.0, d));
    return min(-d * 0.06, 5.0) + bump;
  }

  // Where we are in the life of a breaker: 0 = open water, 1 = about to break, 2 = spent
  float breakStage(float depth) {
    return (1.0 - smoothstep(2.4, 8.0, depth)) + (1.0 - smoothstep(0.4, 2.4, depth));
  }
  // How tall the breaking wave is: it grows as the water shoals, then collapses
  float breakAmp(float depth) {
    float shoal = 1.0 - smoothstep(2.4, 9.0, depth);
    float spent = 1.0 - 0.7 * (1.0 - smoothstep(0.4, 2.4, depth));
    return 1.3 * shoal * spent * smoothstep(0.0, 0.5, depth);
  }
  // Phase of the breaker train (0 = crest). The crests slide toward the shore.
  float breakUAt(float s, vec2 p, float t) {
    vec2 q = p - ISL_C;
    float ang = atan(q.y, q.x);
    float wob = 0.08 * sin(ang * 7.0 + t * 0.2) + 0.05 * sin(ang * 19.0 - t * 0.13);
    return fract(-s / BREAK_L + t / BREAK_T + wob);
  }
  float breakU(vec2 p, float t) { return breakUAt(shoreCoord(p), p, t); }
  // The wave's profile: x = height, y = how far the lip leans toward the shore
  vec2 breakShape(float u, float stage) {
    float bd = u < 0.5 ? u : u - 1.0;
    float wf = mix(0.3, 0.09, clamp(stage, 0.0, 1.0)); // the face steepens as it nears breaking
    float w = bd < 0.0 ? wf : 0.32;
    float h = exp(-(bd * bd) / (w * w));
    float curl = clamp(stage - 0.6, 0.0, 1.0);
    float lq = (bd + 0.04) / 0.07;
    float lean = bd < 0.0 ? exp(-lq * lq) * curl : 0.0;
    return vec2(h, lean * 0.8);
  }
  // Each spent wave running up the beach and sliding back
  float swashLevel(vec2 p, float t) {
    vec2 q = p - ISL_C;
    float ang = atan(q.y, q.x);
    return harborCalm(p) * 0.3 * (0.5 + 0.5 * sin(t * 6.2832 / BREAK_T + ang * 3.0));
  }
`;

// ----- the same, in JS -----
const shoreDistJS = (x, z) => Math.hypot(x - ISL.x, z - ISL.z) - ISL.r;
function bedHeightJS(x, z) {
  const d = shoreDistJS(x, z);
  if (d > 0) return -45 * (1 - Math.exp((-d * 0.05) / 45)) - harborDredgeJS(x, z);
  const bump = (Math.sin(x * 0.11) * Math.sin(z * 0.09) * 0.5 + 0.5) * 2.4 * (1 - smooth(-40, 0, d));
  return Math.min(-d * 0.06, 5.0) + bump;
}
const breakStageJS = (depth) => 1 - smooth(2.4, 8, depth) + (1 - smooth(0.4, 2.4, depth));
const breakAmpJS = (depth) => 1.3 * (1 - smooth(2.4, 9, depth)) * (1 - 0.7 * (1 - smooth(0.4, 2.4, depth))) * smooth(0, 0.5, depth);
function breakUJS(x, z, t) {
  const s = -shoreDistJS(x, z);
  const ang = Math.atan2(z - ISL.z, x - ISL.x);
  const wob = 0.08 * Math.sin(ang * 7 + t * 0.2) + 0.05 * Math.sin(ang * 19 - t * 0.13);
  return fract(-s / BREAK_L + t / BREAK_T + wob);
}
function breakHeightJS(u, stage) {
  const bd = u < 0.5 ? u : u - 1;
  const wf = lerp(0.3, 0.09, clamp(stage, 0, 1));
  const w = bd < 0 ? wf : 0.32;
  return Math.exp(-(bd * bd) / (w * w));
}
const swashJS = (x, z, t) => harborCalmJS(x, z) * 0.3 * (0.5 + 0.5 * Math.sin((t * 6.2832) / BREAK_T + Math.atan2(z - ISL.z, x - ISL.x) * 3));

const _d = { x: 0, y: 0, z: 0 };
function waveDisp(x0, z0, t, out) {
  const depth = -bedHeightJS(x0, z0);
  const damp = lerp(0.12, 1, smooth(0.5, 8, depth)) * harborCalmJS(x0, z0); // waves shrink in shallow water, and in the harbour
  let steepSum = 0;
  for (const w of WAVES) steepSum += w.steep;
  const sideways = Math.min(1, 0.6 / Math.max(steepSum * waveScale * damp, 1e-4));
  let dx = 0, dy = 0, dz = 0;
  for (const w of WAVES) {
    const s = w.steep * waveScale * damp;
    const c = Math.sqrt(9.8 / w.k);
    const f = w.k * (w.dx * x0 + w.dz * z0 - c * t);
    const q = s * sideways;
    const cf = Math.cos(f);
    dx += w.dx * (q / w.k) * cf;
    dy += (s / w.k) * Math.sin(f);
    dz += w.dz * (q / w.k) * cf;
  }
  if (depth < 8) {
    const bA = (0.3 + 0.4 * waveScale) * breakAmpJS(depth) * harborCalmJS(x0, z0);
    if (bA > 0) dy += breakHeightJS(breakUJS(x0, z0, t), breakStageJS(depth)) * bA;
  }
  dy += (1 - smooth(0, 1.2, depth)) * swashJS(x0, z0, t);
  out.x = dx;
  out.y = dy;
  out.z = dz;
}
// Height of the sea at a point: find the grid point that the waves push onto it, then read its height
function waveHeight(x, z, t) {
  let x0 = x, z0 = z;
  for (let i = 0; i < 3; i++) {
    waveDisp(x0, z0, t, _d);
    x0 = x - _d.x;
    z0 = z - _d.z;
  }
  return _d.y;
}

// ===== Ocean surface (waves, breakers, foam, caustics) =====
const WATER_SIZE = 520;
const WATER_STEP = 2; // the grid moves with the camera in steps of this size, so its vertices stay put in the world
const FOG_NEAR = 100;
const FOG_FAR = 250;

// A grid that is finer near the camera (1 m out to 48 m, then 2 m), so breaking waves can have steep faces
const waterGeo = (() => {
  const axis = [];
  for (let x = -WATER_SIZE / 2; x <= WATER_SIZE / 2; x += Math.abs(x) < 48 ? 1 : 2) axis.push(x);
  const n = axis.length;
  const pos = new Float32Array(n * n * 3);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) pos.set([axis[i], 0, axis[j]], (j * n + i) * 3);
  const idx = new Uint32Array((n - 1) * (n - 1) * 6);
  let k = 0;
  for (let j = 0; j < n - 1; j++)
    for (let i = 0; i < n - 1; i++) {
      const a = j * n + i;
      idx.set([a, a + n, a + 1, a + n, a + n + 1, a + 1], k); // wound to face up
      k += 6;
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
})();

// The water doesn't write depth (so things under it can be seen through it), which means it can't hide its
// own far side. So draw its triangles from the farthest to the nearest: the grid is always centred on the
// camera, so nearer waves are then always drawn last, on top of the distant ones.
function sortWaterFarToNear(geo) {
  const pos = geo.attributes.position;
  const idx = geo.index.array;
  const triCount = idx.length / 3;
  const order = new Array(triCount);
  const dist = new Float32Array(triCount);
  for (let t = 0; t < triCount; t++) {
    let cx = 0, cz = 0;
    for (let k = 0; k < 3; k++) {
      cx += pos.getX(idx[t * 3 + k]);
      cz += pos.getZ(idx[t * 3 + k]);
    }
    dist[t] = cx * cx + cz * cz;
    order[t] = t;
  }
  order.sort((a, b) => dist[b] - dist[a]);
  const sorted = new idx.constructor(idx.length);
  order.forEach((t, i) => {
    sorted[i * 3] = idx[t * 3];
    sorted[i * 3 + 1] = idx[t * 3 + 1];
    sorted[i * 3 + 2] = idx[t * 3 + 2];
  });
  geo.setIndex(new THREE.BufferAttribute(sorted, 1));
}
sortWaterFarToNear(waterGeo);

const MAX_LAMPS = 12; // the raft's lamp and the lanterns, which light the water around them
const waterUniforms = Object.assign({}, shared, {
  uWaves: { value: WAVES.map((w) => new THREE.Vector4(w.dx, w.dz, w.k, w.steep)) },
  uWaveScale: { value: 1 },
  uFoam: { value: 0.35 },
  uCamPos: { value: new THREE.Vector3() },
  uDeep: { value: new THREE.Color(0x0b3553) },
  uShallow: { value: new THREE.Color(0x1f7a8c) },
  uLight: { value: 1 },
  uFogNear: { value: FOG_NEAR },
  uFogFar: { value: FOG_FAR },
  uLampPos: { value: Array.from({ length: MAX_LAMPS }, () => new THREE.Vector3(0, -100, 0)) },
  uLampColor: { value: Array.from({ length: MAX_LAMPS }, () => new THREE.Vector3()) },
});

// Foam on the water: whitecaps, breakers and the swash, as one lacy pattern. Shared by the water (whose
// caustics use the same cells) and by the foam layer, which draws it on top of everything under the water.
const FOAM_GLSL = /* glsl */ `
  vec2 hash22(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.xx + p3.yz) * p3.zy);
  }
  // Distance to the nearest wall between animated cells
  float cellEdge(vec2 p, float t) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    float f1 = 8.0;
    float f2 = 8.0;
    for (int y = -1; y <= 1; y++) {
      for (int x = -1; x <= 1; x++) {
        vec2 g = vec2(float(x), float(y));
        vec2 o = 0.5 + 0.4 * sin(t + 6.2831 * hash22(i + g));
        float d = length(g + o - f);
        if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) { f2 = d; }
      }
    }
    return f2 - f1;
  }
  // A lacy white network around dark holes, like real sea foam.
  // density 0..1: 1 = solid white water; as it falls the holes open up until only thin threads are left
  float foamLace(vec2 p, float density) {
    if (density < 0.01) return 0.0;
    vec2 q = p + vec2(vnoise(p * 0.18), vnoise(p * 0.18 + 5.7)) * 6.0; // bend the cells into organic blobs
    float big = cellEdge(q * 0.45, 0.0);        // holes a couple of metres across
    float small = cellEdge(q * 1.7 + 3.1, 0.0); // smaller holes and fine threads within the bands
    float lace = exp(-big * 3.0) * 0.75 + exp(-small * 5.0) * 0.35 + (vnoise(q * 3.0) - 0.5) * 0.15;
    float th = mix(1.05, -0.1, density);
    return smoothstep(th, th + 0.08, lace);
  }
  // How much foam covers this point of the surface (w: the surface point, height: its wave height,
  // bed: sea floor height below it, dist: distance from the camera, t: time, ws: wave scale, caps: whitecaps)
  float foamAmount(vec3 w, float height, float bed, float dist, float t, float ws, float caps) {
    float far = smoothstep(80.0, 300.0, dist);
    float crest = clamp(height / (1.8 * max(ws, 0.3)) * 0.5 + 0.5, 0.0, 1.0);
    float bedDepth = -bed;
    float depthW = max(w.y - bed, 0.0);
    float stage = breakStage(bedDepth);
    float bu = breakU(w.xz, t);
    float bd = bu < 0.5 ? bu : bu - 1.0; // distance from the breaker's crest in wavelengths (negative = shore side)
    float foamNoise = fbm(w.xz * 0.35 + vec2(t * 0.02, t * 0.12));
    // Whitecaps on the open sea, in patches
    float capDensity = smoothstep(0.8, 0.98, crest + (foamNoise - 0.5) * 0.3) * caps * 1.4;
    // Breakers: solid white where the lip pours over and the white water tumbles in, ageing into lace behind,
    // and a thin veil of old foam over the whole surf zone. It keeps going right up the beach.
    float foamSize = clamp(0.4 + ws * 0.6, 0.0, 1.0) * (1.0 - smoothstep(2.5, 8.0, bedDepth)) * harborCalm(w.xz);
    float curl = clamp(stage - 0.6, 0.0, 1.0);
    float lipFoam = exp(-(((bd + 0.01) / 0.02) * ((bd + 0.01) / 0.02))) * smoothstep(0.7, 1.1, stage);
    float trail = bd >= 0.0 ? exp(-bd * mix(9.0, 4.5, clamp(stage - 1.0, 0.0, 1.0))) * curl : 0.0;
    float surfDensity = max(max(lipFoam, trail), 0.45 * smoothstep(1.2, 1.8, stage) * (0.6 + 0.8 * foamNoise)) * foamSize;
    // The swash: a bright foam line along its edge, lace scattered over the thin water behind it
    float edgeLine = smoothstep(0.0, 0.012, depthW) * exp(-depthW / 0.035);
    float swashLace = (1.0 - smoothstep(0.05, 0.6, depthW)) * 0.35 * clamp(0.4 + ws * 0.6, 0.0, 1.0) * smoothstep(-0.02, 0.02, w.y - bed);
    float density = clamp(max(max(capDensity, surfDensity), max(edgeLine, swashLace)), 0.0, 1.0);
    vec2 drift = vec2(0.0, t * 0.15); // the foam drifts slowly toward the shore
    return mix(foamLace(w.xz + drift, density), density * 0.7, far); // smooth it far away
  }
`;

// The water surface's vertex shader: waves, breakers and swash (shared by the water and its foam layer)
const WATER_VERTEX = /* glsl */ `
  ${SHORE_GLSL}
  uniform float uTime;
  uniform float uWaveScale;
  uniform vec4 uWaves[4];
  varying vec3 vWorld;
  varying vec3 vNormal;
  varying float vHeight;
  varying float vBed;

  void main() {
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vec3 tangent = vec3(1.0, 0.0, 0.0);
    vec3 binormal = vec3(0.0, 0.0, 1.0);
    vec3 disp = vec3(0.0);

    // Waves shrink in shallow water
    float bed = bedHeight(wp.xz);
    float depth = -bed;
    float damp = mix(0.12, 1.0, smoothstep(0.5, 8.0, depth));
    // Calm the waves near the edge of the grid so its border never wobbles into view
    float edge = 1.0 - smoothstep(${(WATER_SIZE * 0.39).toFixed(1)}, ${(WATER_SIZE * 0.485).toFixed(1)}, max(abs(position.x), abs(position.z)));
    damp *= edge * harborCalm(wp.xz);

    // Gerstner waves. The sideways (horizontal) push is capped so crests can never fold over
    // into loops, and each wave fades out with distance before the grid gets too coarse to draw it.
    float steepSum = 0.0;
    for (int i = 0; i < 4; i++) steepSum += uWaves[i].w;
    float sideways = min(1.0, 0.6 / max(steepSum * uWaveScale * damp, 1e-4));
    float camDist = length(wp.xz - cameraPosition.xz);
    for (int i = 0; i < 4; i++) {
      vec4 w = uWaves[i];
      vec2 d = w.xy;
      float k = w.z;
      float len = 6.2832 / k;
      float fade = 1.0 - smoothstep(len * 9.0, len * 22.0, camDist);
      float s = w.w * uWaveScale * damp * fade;
      float c = sqrt(9.8 / k);
      float f = k * (dot(d, wp.xz) - c * uTime);
      float a = s / k;
      float q = s * sideways; // horizontal steepness
      float cf = cos(f);
      float sf = sin(f);
      disp += vec3(d.x * (q / k) * cf, a * sf, d.y * (q / k) * cf);
      tangent += vec3(-d.x * d.x * q * sf, d.x * s * cf, -d.x * d.y * q * sf);
      binormal += vec3(-d.x * d.y * q * sf, d.y * s * cf, -d.y * d.y * q * sf);
    }

    vHeight = disp.y;

    // Breaking waves in the shallows: their height, and a lean toward the shore as the lip curls over.
    // Their slope is added to the surface normal. The lean is capped so the surface never folds over itself.
    float bA = depth < 8.0 ? (0.3 + 0.4 * uWaveScale) * breakAmp(depth) * edge * harborCalm(wp.xz) : 0.0;
    if (bA > 0.0) {
      float stage = breakStage(depth);
      float lean = min(bA, 1.0);
      float e = 0.5;
      vec2 px = wp.xz + vec2(e, 0.0);
      vec2 pz = wp.xz + vec2(0.0, e);
      float s0 = shoreCoord(wp.xz);
      float sx = shoreCoord(px);
      float sz = shoreCoord(pz);
      vec2 toShore = normalize(vec2(sx - s0, sz - s0) + vec2(1e-6));
      vec2 b0 = breakShape(breakUAt(s0, wp.xz, uTime), stage);
      vec2 bx = breakShape(breakUAt(sx, px, uTime), stage);
      vec2 bz = breakShape(breakUAt(sz, pz, uTime), stage);
      disp += vec3(toShore.x * b0.y * lean, b0.x * bA, toShore.y * b0.y * lean);
      tangent += vec3(toShore.x * (bx.y - b0.y) * lean, (bx.x - b0.x) * bA, toShore.y * (bx.y - b0.y) * lean) / e;
      binormal += vec3(toShore.x * (bz.y - b0.y) * lean, (bz.x - b0.x) * bA, toShore.y * (bz.y - b0.y) * lean) / e;
    }

    vec3 p = wp.xyz + disp;
    // The swash: each spent wave running up the beach and sliding back (only right at the waterline)
    p.y += (1.0 - smoothstep(0.0, 1.2, depth)) * swashLevel(wp.xz, uTime);

    vNormal = normalize(cross(binormal, tangent));
    vWorld = p;
    vBed = bed;
    gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
  }
`;

const water = new THREE.Mesh(
  waterGeo,
  new THREE.ShaderMaterial({
    uniforms: waterUniforms,
    vertexShader: WATER_VERTEX,
    fragmentShader: /* glsl */ `
      ${SKY_GLSL}
      ${NOISE_GLSL}
      ${CLOUD_GLSL}
      ${SHORE_GLSL}
      uniform float uAurora;
      uniform vec3 uCamPos;
      uniform vec3 uDeep;
      uniform vec3 uShallow;
      uniform float uLight;
      uniform float uWaveScale;
      uniform float uFoam;
      uniform float uFogNear;
      uniform float uFogFar;
      uniform vec3 uLampPos[${MAX_LAMPS}];
      uniform vec3 uLampColor[${MAX_LAMPS}];
      varying vec3 vWorld;
      varying vec3 vNormal;
      varying float vHeight;
      varying float vBed;

      // Small wind ripples on top of the big waves: a handful of short waves running in different
      // directions, plus a little noise on a rotated grid (plain value noise shows a checkerboard in the glints)
      float ripple(vec2 p, float t) {
        float h = sin(dot(p, vec2(0.96, 0.28)) * 3.1 + t * 2.3) * 0.18
                + sin(dot(p, vec2(-0.42, 0.91)) * 3.7 + t * 2.6) * 0.15
                + sin(dot(p, vec2(0.71, -0.70)) * 4.6 + t * 2.9) * 0.11
                + sin(dot(p, vec2(-0.88, -0.47)) * 5.3 + t * 3.2) * 0.1
                + sin(dot(p, vec2(0.17, 0.98)) * 6.9 + t * 3.6) * 0.07
                + sin(dot(p, vec2(0.55, 0.83)) * 8.1 + t * 4.0) * 0.06;
        vec2 q = mat2(0.8, -0.6, 0.6, 0.8) * p;
        return 0.5 + h * 0.5 + (vnoise(q * 1.3 + t * vec2(0.1, 0.3)) - 0.5) * 0.25;
      }

      // ---- Caustics: sunlight focused by the moving surface into a bright, wobbling net ----
      ${FOAM_GLSL}
      float causticLayer(vec2 p, float t) {
        // Warp so the cell walls bend and drift like light through moving waves
        p += vec2(vnoise(p * 0.7 + t * 0.3), vnoise(p * 0.7 - t * 0.25 + 4.0)) * 0.9;
        return exp(-cellEdge(p, t) * 9.0);
      }
      float causticNet(vec2 p, float t) {
        float c = (causticLayer(p, t) + causticLayer(p * 0.73 + 5.2, t * 1.3)) * 0.5;
        return pow(c, 1.8) * 2.2;
      }
      // Slight colour split at the edges, like real refracted sunlight
      vec3 caustics(vec2 p, float t) {
        vec2 off = vec2(0.035, 0.02);
        return vec3(causticNet(p + off, t), causticNet(p, t), causticNet(p - off, t));
      }

      // ---- Sea floor: pale sand, with patches of coral rubble on the reef shelf around the island ----
      float coralTex(vec2 p) {
        vec2 q = mat2(0.8, -0.6, 0.6, 0.8) * p;
        return vnoise(q * 1.1) * 0.6 + vnoise(q * 2.7 + 7.0) * 0.4;
      }
      vec3 seabed(vec2 p, float dOut, out float bump) {
        vec3 sand = vec3(0.88, 0.84, 0.74) * (0.88 + 0.24 * vnoise(p * 0.6)); // pale, as sand looks under water
        float reefZone = smoothstep(25.0, 55.0, dOut) * (1.0 - smoothstep(90.0, 140.0, dOut));
        float patchN = fbm(p * 0.07) + (vnoise(p * 0.5) - 0.5) * 0.15;
        float coral = smoothstep(0.42, 0.56, patchN) * reefZone;
        float tex = coralTex(p);
        float kind = fbm(p * 0.05 + 11.0);
        vec3 cc = mix(vec3(0.74, 0.68, 0.58), vec3(0.74, 0.62, 0.62), smoothstep(0.4, 0.62, kind));
        cc = mix(cc, vec3(0.6, 0.64, 0.5), smoothstep(0.5, 0.72, vnoise(p * 0.21 + 3.0)) * 0.5);
        cc *= 0.8 + 0.3 * tex;
        bump = coral * (0.2 + 0.4 * tex);
        return mix(sand, cc, coral * 0.7);
      }

      void main() {
        vec3 toCam = uCamPos - vWorld;
        float dist = length(toCam);
        vec3 v = toCam / dist;
        float far = smoothstep(80.0, 300.0, dist);

        // Normal: big waves + fine ripples up close, flattened far away to avoid shimmer
        vec3 n = normalize(vNormal);
        float detail = (1.0 - smoothstep(25.0, 160.0, dist)) * (0.35 + 0.25 * uWaveScale);
        if (detail > 0.0) {
          vec2 rp = vWorld.xz * 0.7;
          float e = 0.08;
          float h0 = ripple(rp, uTime);
          float hx = ripple(rp + vec2(e, 0.0), uTime);
          float hz = ripple(rp + vec2(0.0, e), uTime);
          n = normalize(n + vec3(-(hx - h0) / e, 0.0, -(hz - h0) / e) * 0.12 * detail);
        }
        n = normalize(mix(n, vec3(0.0, 1.0, 0.0), far));

        // Reflection of the sky (Fresnel: more reflective at grazing angles)
        float fres = 0.02 + 0.98 * pow(1.0 - max(dot(n, v), 0.0), 5.0);
        vec3 r = reflect(-v, n);
        r.y = abs(r.y);
        float cShadow = mix(1.0, cloudShadow(vWorld, uSunDir), uSunVis);
        vec3 refl = skyColor(r) * mix(0.8, 1.0, cShadow);

        // Deep water colour
        float diff = max(dot(n, uSunDir), 0.0) * uSunVis * cShadow;
        float crest = clamp(vHeight / (1.8 * max(uWaveScale, 0.3)) * 0.5 + 0.5, 0.0, 1.0);
        vec3 body = mix(uDeep, uShallow, crest * 0.8);
        body *= uLight * (0.6 + 0.4 * diff) * mix(0.75, 1.0, cShadow);

        // Subsurface glow: sunlight shining through thin wave crests
        float sss = pow(clamp(dot(v, -uSunDir) * 0.5 + 0.5, 0.0, 1.0), 3.0) * smoothstep(0.45, 0.9, crest);
        body += vec3(0.05, 0.4, 0.33) * sss * uSunVis * cShadow * uLight;

        // Where we are in the life of a breaker (see breakShape)
        float bedDepth = -vBed;
        float stage = breakStage(bedDepth);
        float bu = breakU(vWorld.xz, uTime);
        float bd = bu < 0.5 ? bu : bu - 1.0; // distance from the crest in wavelengths (negative = shore side)
        float surfSize = clamp(0.4 + uWaveScale * 0.6, 0.0, 1.0) * smoothstep(0.1, 0.9, bedDepth) * (1.0 - smoothstep(2.5, 8.0, bedDepth));

        // Clear water: the sea floor shows through even when deep, red fading first
        float dOut = shoreDist(vWorld.xz);
        float depthW = max(vWorld.y - vBed, 0.0);
        vec3 water = body;
        if (depthW < 30.0) {
          vec2 sunShift = uSunDir.xz / max(uSunDir.y, 0.25);
          vec2 bedP = vWorld.xz - n.xz * depthW * 0.6 - sunShift * depthW * 0.3; // refraction
          float bump;
          vec3 bedCol = seabed(bedP, dOut, bump);
          float dBed = max(depthW - bump, 0.05);
          float lit = uSunVis * cShadow;
          vec3 caust = vec3(0.0);
          if (dist < 140.0) caust = caustics(bedP * 0.9, uTime) * (1.0 - smoothstep(40.0, 140.0, dist));
          bedCol = bedCol * uLight * (0.45 + 0.55 * lit) + bedCol * uSunColor * caust * 0.65 * lit * exp(-dBed * 0.12);
          vec3 absorb = exp(-dBed * vec3(0.45, 0.12, 0.08));
          vec3 turquoise = vec3(0.2, 0.85, 0.9) * uLight * mix(0.75, 1.0, cShadow); // bright aqua over sand
          vec3 inscatter = mix(turquoise, body, smoothstep(10.0, 28.0, depthW));
          vec3 shallowCol = bedCol * absorb + inscatter * (1.0 - absorb);
          water = mix(shallowCol, body, smoothstep(20.0, 30.0, depthW));
        }
        // Light shining through the thin face of a curling wave: glassy turquoise, brightest against the sun
        float face = (bd < 0.0 ? smoothstep(-0.07, -0.005, bd) : 1.0 - smoothstep(0.0, 0.03, bd)) * clamp(1.0 - abs(stage - 1.0), 0.0, 1.0) * surfSize;
        float backlit = pow(clamp(dot(v, -uSunDir) * 0.5 + 0.5, 0.0, 1.0), 2.0) * uSunVis * cShadow;
        water = mix(water, vec3(0.08, 0.72, 0.62) * uLight * (0.5 + 0.7 * backlit), face * 0.75);
        vec3 col = mix(water, refl, fres);

        // Sun glitter: a sharp core plus a broad sheen, and the moon's path at night
        float sd = max(dot(r, uSunDir), 0.0);
        col += uSunColor * (pow(sd, 900.0) * 8.0 + pow(sd, 90.0) * 0.35) * uSunVis * cShadow;
        col += vec3(0.7, 0.8, 1.0) * pow(max(dot(r, -uSunDir), 0.0), 300.0) * 1.2 * uStars;

        // The night sky mirrored in the sea: stars glitter on the moving waves, the aurora lays
        // long wavering streaks of green toward you.
        if ((uStars > 0.01 || uAurora > 0.01) && dist < 900.0) {
          vec3 rr = normalize(vec3(r.x, max(r.y, 0.015), r.z));
          float mirror = (0.35 + 0.65 * fres) * (1.0 - smoothstep(500.0, 900.0, dist));
          vec3 cell = floor(rr * 260.0);
          float sn = fract(sin(dot(cell, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
          float tw = 0.55 + 0.45 * sin(uTime * 3.0 + fract(sn * 977.0) * 6.2832);
          col += vec3(0.85, 0.9, 1.0) * step(0.997, sn) * tw * uStars * (0.1 + 0.9 * fres) * smoothstep(0.0, 0.05, rr.y);
          col += vec3(0.05, 0.07, 0.12) * uStars * mirror;
          if (uAurora > 0.001) {
            float az = atan(rr.x, -rr.z);
            float north = 1.0 - smoothstep(0.4, 1.7, abs(az));
            float edge = 0.06 + 0.05 * sin(az * 3.0 + uTime * 0.07);
            float h = rr.y;
            float vert = smoothstep(edge * 0.5, edge + 0.03, h) * (1.0 - smoothstep(edge + 0.04, edge + 0.45, h));
            float curtain = smoothstep(0.35, 0.75, fbm(vec2(az * 4.0 + sin(az * 7.0 + uTime * 0.15) * 0.4, uTime * 0.05)));
            vec3 ac = mix(vec3(0.15, 1.0, 0.55), vec3(0.65, 0.25, 0.95), smoothstep(edge + 0.08, edge + 0.35, h));
            col += ac * curtain * vert * north * uAurora * 0.45 * mirror;
          }
        }

        // (Foam is drawn by its own layer, on top of whatever floats on the water)

        // The raft's lamp and the lanterns shining on the water: a soft pool plus glints on the waves
        for (int i = 0; i < ${MAX_LAMPS}; i++) {
          vec3 L = uLampPos[i] - vWorld;
          float ld = length(L);
          L /= ld;
          float att = 1.0 - smoothstep(0.0, 14.0, ld);
          att *= att;
          float diffL = max(dot(n, L), 0.0);
          float specL = pow(max(dot(r, L), 0.0), 40.0);
          col += uLampColor[i] * att * (diffL * 0.5 + specL * 1.5);
        }

        // Fade into the horizon so the edge of the water meets the sky
        vec3 fogCol = skyColor(normalize(vec3(-v.x + 1e-4, 0.0, -v.z)));
        col = mix(col, fogCol, smoothstep(uFogNear, uFogFar, dist));

        float alpha = smoothstep(0.0, 0.07, depthW);
        gl_FragColor = vec4(col, alpha);
      }
    `,
    // Blended (for the see-through waterline) but kept in the solid pass
    blending: THREE.CustomBlending,
    blendSrc: THREE.SrcAlphaFactor,
    blendDst: THREE.OneMinusSrcAlphaFactor,
  })
);
water.renderOrder = 1;
water.material.depthWrite = false;
water.frustumCulled = false;
scene.add(water);

// ===== Procedural noise and textures (JS side), for bark, plaster, stone and so on =====
function jhash(x, y, z) {
  const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123;
  return s - Math.floor(s);
}
function jnoise(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy), uz = fz * fz * (3 - 2 * fz);
  const a = lerp(jhash(ix, iy, iz), jhash(ix + 1, iy, iz), ux);
  const b = lerp(jhash(ix, iy + 1, iz), jhash(ix + 1, iy + 1, iz), ux);
  const c = lerp(jhash(ix, iy, iz + 1), jhash(ix + 1, iy, iz + 1), ux);
  const d = lerp(jhash(ix, iy + 1, iz + 1), jhash(ix + 1, iy + 1, iz + 1), ux);
  return lerp(lerp(a, b, uy), lerp(c, d, uy), uz);
}
function jfbm(x, y, z, oct = 3) {
  let v = 0, a = 0.5;
  for (let i = 0; i < oct; i++) {
    v += a * jnoise(x, y, z);
    x = x * 2.03 + 11.1;
    y = y * 2.03 + 5.3;
    z = z * 2.03 + 7.7;
    a *= 0.5;
  }
  return v;
}
const canvasTex = (w, h, draw) => {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
};
// A texture from a per-pixel function (u, v in 0..1, v up) returning [r, g, b] in 0..1
function pixTex(w, h, fn) {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const [r, g, b] = fn(x / w, 1 - y / h);
      const i = (y * w + x) * 4;
      img.data[i] = clamp(r, 0, 1) * 255;
      img.data[i + 1] = clamp(g, 0, 1) * 255;
      img.data[i + 2] = clamp(b, 0, 1) * 255;
      img.data[i + 3] = 255;
    }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
const grey = (v) => [v, v, v];
// Bark / weathered wood grain, tileable along both axes
const barkTex = pixTex(128, 256, (u, v) => {
  const fibre = jnoise(Math.cos(u * 6.283) * 5, Math.sin(u * 6.283) * 5 + v * 0.4, v * 28);
  const crack = jnoise(Math.cos(u * 6.283) * 3, Math.sin(u * 6.283) * 3, v * 5);
  let k = 0.55 + 0.55 * fibre;
  if (crack > 0.7) k *= 0.45;
  return [0.42 * k, 0.31 * k, 0.21 * k];
});
const driftTex = pixTex(128, 256, (u, v) => {
  const g = jnoise(Math.cos(u * 6.283) * 6, Math.sin(u * 6.283) * 6, v * 40);
  const crack = jnoise(Math.cos(u * 6.283) * 3, Math.sin(u * 6.283) * 3, v * 6) > 0.74 ? 0.5 : 1;
  const k = (0.65 + 0.5 * g) * crack;
  return [0.66 * k, 0.61 * k, 0.55 * k];
});
const bambooTex = pixTex(32, 128, (u, v) => {
  const f = (v * 2) % 1; // two nodes per repeat
  const node = Math.exp(-Math.pow((f - 0.5) / 0.025, 2));
  const n = jnoise(u * 12, v * 60, 3);
  const k = (0.85 + 0.3 * n) * (1 - 0.45 * node);
  return [0.62 * k + 0.1 * node, 0.66 * k, 0.26 * k];
});
const charTex = pixTex(64, 128, (u, v) => {
  const n = jnoise(u * 9, v * 14, 1) + 0.5 * jnoise(u * 20, v * 30, 2);
  const ember = n > 1.05 ? 1 : 0;
  const k = 0.1 + 0.08 * n;
  return [k + ember * 0.8, k * 0.9 + ember * 0.25, k * 0.8];
});
const copperTex = pixTex(128, 128, (u, v) => {
  const n = jfbm(u * 8, v * 8, 2, 3);
  const seam = Math.abs(Math.sin(u * 6.283 * 12)) < 0.04 ? 0.7 : 1;
  const verdi = smooth(0.35, 0.6, n + 0.2 * (1 - v));
  const k = seam * (0.85 + 0.3 * jnoise(u * 60, v * 60, 1));
  return [lerp(0.7, 0.3, verdi) * k, lerp(0.38, 0.62, verdi) * k, lerp(0.24, 0.52, verdi) * k];
});

// ===== A rock: a displaced sphere with stone layers, lichen and moss on top, wet and barnacled near the water =====
function makeRock(detail, seed, wetBelow) {
  const geo = new THREE.IcosahedronGeometry(1, detail);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const n = jfbm(x * 1.5 + seed, y * 1.5, z * 1.5 + seed, 4);
    const ridge = 1 - Math.abs(jnoise(x * 3.4 + seed, y * 3.4, z * 3.4) * 2 - 1);
    const r = 0.72 + 0.55 * n + 0.14 * ridge + 0.03 * jnoise(x * 14, y * 14, z * 14 + seed);
    p.setXYZ(i, x * r, y * r * 0.72, z * r);
  }
  geo.computeVertexNormals();
  const nrm = geo.attributes.normal;
  const col = new Float32Array(p.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), ny = nrm.getY(i);
    const grain = jnoise(x * 6 + seed, y * 6, z * 6);
    c.setRGB(0.52, 0.5, 0.47).lerp(new THREE.Color(0.36, 0.34, 0.34), grain);
    c.multiplyScalar((0.92 + 0.12 * Math.sin(y * 16 + jnoise(x * 2, y * 2, z * 2) * 5)) * (0.85 + 0.3 * jnoise(x * 20, y * 20, z * 20)));
    const up = smooth(0.35, 0.85, ny);
    const lich = jnoise(x * 8 + seed, y * 8, z * 8) * up;
    if (lich > 0.42) c.lerp(new THREE.Color(0.78, 0.6, 0.22), 0.55); // orange lichen
    else if (lich > 0.3) c.lerp(new THREE.Color(0.62, 0.66, 0.4), 0.5); // pale green lichen
    const moss = smooth(0.55, 0.95, ny) * smooth(0.35, 0.6, jnoise(x * 3 + 9, y * 3, z * 3 + seed));
    c.lerp(new THREE.Color(0.2, 0.3, 0.12), moss * 0.85);
    if (y < wetBelow) {
      c.multiplyScalar(0.62); // dark and wet near the water
      if (jnoise(x * 38, y * 38, z * 38) > 0.8) c.lerp(new THREE.Color(0.86, 0.85, 0.8), 0.8); // barnacles
      else if (jnoise(x * 5 + 3, y * 5, z * 5) > 0.6) c.lerp(new THREE.Color(0.12, 0.25, 0.1), 0.5); // algae
    }
    col[i * 3] = c.r;
    col[i * 3 + 1] = c.g;
    col[i * 3 + 2] = c.b;
  }
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  return geo;
}

// ===== Wind, shared by the trees and the grass =====
const windU = { uWind: { value: new THREE.Vector2(0, -1) }, uWindStr: { value: 0.2 } };

// ===== Small helpers for building merged geometry =====
function mergeGeos(list) {
  const pos = [], nor = [], uv = [], col = [], idx = [];
  let off = 0;
  for (const { g, color } of list) {
    const p = g.attributes.position, n = g.attributes.normal, u = g.attributes.uv;
    const c = color ? new THREE.Color(color) : new THREE.Color(1, 1, 1);
    for (let i = 0; i < p.count; i++) {
      pos.push(p.getX(i), p.getY(i), p.getZ(i));
      nor.push(n.getX(i), n.getY(i), n.getZ(i));
      uv.push(u ? u.getX(i) : 0, u ? u.getY(i) : 0);
      col.push(c.r, c.g, c.b);
    }
    if (g.index) for (let i = 0; i < g.index.count; i++) idx.push(g.index.getX(i) + off);
    else for (let i = 0; i < p.count; i++) idx.push(i + off);
    off += p.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  out.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  out.setIndex(idx);
  return out;
}

// Plant geometry (palms and grass) is built in world space as plain triangles, each vertex carrying where its
// plant is rooted and how it should move, so one wind shader can bend the whole trunk and flutter the leaves.
let plantKind = 0; // 0 trunk, 1 frond, 2 grass
const plantNew = () => ({ pos: [], nor: [], col: [], base: [], sway: [], kind: [] });
const _pn = new THREE.Vector3(), _pa = new THREE.Vector3();
function plantVert(m, p, n, c, base, H, fl, ph) {
  m.pos.push(p.x, p.y, p.z);
  m.nor.push(n.x, n.y, n.z);
  m.col.push(c.r, c.g, c.b);
  m.base.push(base.x, base.y, base.z);
  m.sway.push(H, fl, ph);
  m.kind.push(plantKind);
}
function plantTri(m, p0, p1, p2, c0, c1, c2, base, H, f0, f1, f2, ph) {
  _pn.subVectors(p1, p0).cross(_pa.subVectors(p2, p0)).normalize();
  if (_pn.y < 0) _pn.negate(); // face up: lit like the top of a leaf from either side
  plantVert(m, p0, _pn, c0, base, H, f0, ph);
  plantVert(m, p1, _pn, c1, base, H, f1, ph);
  plantVert(m, p2, _pn, c2, base, H, f2, ph);
}
function plantGeometry(m) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(m.pos, 3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(m.nor, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(m.col, 3));
  g.setAttribute("aBase", new THREE.Float32BufferAttribute(m.base, 3));
  g.setAttribute("aSway", new THREE.Float32BufferAttribute(m.sway, 3));
  g.setAttribute("aKind", new THREE.Float32BufferAttribute(m.kind, 1));
  return g;
}

// A material whose vertices bend in the wind: the trunk leans downwind in slow gusts that travel across the
// island, swaying back and forth, and the fronds stream downwind and flutter faster toward their tips.
function windMaterial() {
  const m = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = shared.uTime;
    sh.uniforms.uWind = windU.uWind;
    sh.uniforms.uWindStr = windU.uWindStr;
    sh.uniforms.uSunDir = shared.uSunDir;
    sh.uniforms.uSunColor = shared.uSunColor;
    sh.uniforms.uSunVis = shared.uSunVis;
    sh.vertexShader =
      "attribute vec3 aBase;\nattribute vec3 aSway;\nattribute float aKind;\nuniform float uTime;\nuniform vec2 uWind;\nuniform float uWindStr;\nvarying float vKind;\nvarying vec3 vW;\nvarying float vHn;\nvarying float vPh;\n" +
      sh.vertexShader.replace(
        "#include <begin_vertex>",
        /* glsl */ `#include <begin_vertex>
        {
          vec2 wd = normalize(uWind + vec2(1e-5));
          float H = max(aSway.x, 0.1);
          float hn = clamp((position.y - aBase.y) / H, 0.0, 1.6);
          vKind = aKind;
          vW = position;
          vHn = hn;
          vPh = aSway.z;
          float bendK = hn * hn;                        // stiff at the root, free at the top
          float gp = dot(aBase.xz, wd) * 0.045 - uTime * (0.55 + 0.8 * uWindStr);
          float gust = 0.5 + 0.5 * sin(gp) * (0.65 + 0.35 * sin(gp * 0.37 + 1.3)); // gusts travelling downwind
          float lean = 0.02 + 0.2 * uWindStr * (0.45 + gust);
          float osc = 0.6 * sin(uTime * (0.8 + 0.9 * uWindStr) + aSway.z) + 0.4 * sin(uTime * 1.7 + aSway.z * 2.3);
          vec2 push = wd * (lean + 0.05 * uWindStr * osc) * H * bendK * 0.55
                    + vec2(-wd.y, wd.x) * osc * 0.035 * (0.4 + uWindStr) * H * bendK * 0.55;
          transformed.xz += push;
          transformed.y -= dot(push, push) * 0.4 / H;   // bending along an arc: the top comes down a little
          float fl = aSway.y;                           // leaves: stream downwind and flutter
          transformed.xz += wd * fl * (0.06 + 0.5 * uWindStr) * (0.55 + 0.45 * gust);
          float ft = uTime * (2.6 + 5.0 * uWindStr);
          transformed += fl * (0.015 + 0.13 * uWindStr) * vec3(
            sin(ft + position.x * 3.1 + aSway.z),
            0.6 * sin(ft * 1.3 + position.z * 2.7 + aSway.z * 1.9),
            sin(ft * 0.9 + position.y * 3.3 + aSway.z * 0.7));
        }`
      );
    sh.fragmentShader =
      /* glsl */ `uniform vec3 uSunDir;
      uniform vec3 uSunColor;
      uniform float uSunVis;
      varying float vKind;
      varying vec3 vW;
      varying float vHn;
      varying float vPh;
      float whash(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
      float wnoise(vec3 p) {
        vec3 i = floor(p); vec3 f = fract(p); vec3 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(whash(i), whash(i + vec3(1,0,0)), u.x), mix(whash(i + vec3(0,1,0)), whash(i + vec3(1,1,0)), u.x), u.y),
                   mix(mix(whash(i + vec3(0,0,1)), whash(i + vec3(1,0,1)), u.x), mix(whash(i + vec3(0,1,1)), whash(i + vec3(1,1,1)), u.x), u.y), u.z);
      }
      ` +
      sh.fragmentShader
        .replace(
          "#include <color_fragment>",
          /* glsl */ `#include <color_fragment>
          {
            vec3 q = vW;
            float n1 = wnoise(q * 6.0);
            float n2 = wnoise(q * 23.0);
            if (vKind < 0.5) {
              // palm bark: fibrous, with raised growth scars every few centimetres, and damp moss at the foot
              float fibre = wnoise(vec3(q.x * 22.0, q.y * 2.4, q.z * 22.0));
              float ring = smoothstep(0.6, 0.96, abs(sin(q.y * 12.0 + n1 * 2.5)));
              vec3 bark = diffuseColor.rgb * (0.6 + 0.8 * fibre);
              bark = mix(bark, bark * 0.4, ring * 0.85);
              bark = mix(bark, vec3(0.15, 0.2, 0.09), (1.0 - smoothstep(0.02, 0.16, vHn)) * 0.55 * smoothstep(0.3, 0.7, n1));
              diffuseColor.rgb = bark;
            } else if (vKind < 1.5) {
              // fronds: mottled, with sun-scorched tips on some leaves and a little yellowing
              float dry = step(0.78, fract(vPh * 7.31)) * smoothstep(0.5, 1.2, vHn);
              diffuseColor.rgb *= 0.8 + 0.4 * n2;
              diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.5, 0.4, 0.15), dry * 0.45 * smoothstep(0.3, 0.8, n1));
            } else {
              // grass: fine streaks along each blade, a few dry yellow blades
              float streak = wnoise(vec3(q.x * 48.0, q.y * 4.0, q.z * 48.0));
              diffuseColor.rgb *= 0.75 + 0.5 * streak;
              diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(1.35, 1.1, 0.5), step(0.82, whash(floor(q * 9.0))));
            }
          }`
        )
        .replace(
          "#include <fog_fragment>",
          /* glsl */ `{
            // leaves and grass let sunlight through when you look toward the sun
            vec3 vd = normalize(cameraPosition - vW);
            float tr = pow(max(dot(vd, -uSunDir), 0.0), 2.0) * uSunVis * step(0.5, vKind);
            gl_FragColor.rgb += diffuseColor.rgb * uSunColor * tr * 0.5;
          }
          #include <fog_fragment>`
        );
  };
  m.customProgramCacheKey = () => "wind-plants-2";
  return m;
}

// ===== The island =====
const colliders = []; // circles the player can't walk through
// Marks in the sand live in a texture that wraps around the player (48 m across): footprints and drawn lines are
// stamped in, and the sea, rain and time slowly smooth them away.
const IMP_N = 1536, IMP_S = 48;
const impRT = new THREE.WebGLRenderTarget(IMP_N, IMP_N, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping, depthBuffer: false });
const landUniforms = Object.assign({}, shared, {
  uImprint: { value: impRT.texture },
  uImpPlayer: { value: new THREE.Vector2() },
  uWet: { value: 0 },
  uCamPos: waterUniforms.uCamPos,
  uFogN: { value: 120 },
  uFogF: { value: 900 },
  uLampPos: waterUniforms.uLampPos,
  uLampColor: waterUniforms.uLampColor,
});

// The ground. Sand is shaded procedurally: wind ripples and grains with a bump-mapped relief, quartz and mineral
// specks, shells and kelp left along the high-tide line, damp dark sand that the swash keeps soaking and
// shining, and dune grass taking over higher up. The same bedHeight drives the water, so they always meet.
const land = new THREE.Mesh(
  (() => {
    const RMAX = ISL.r + 30;
    const RINGS = 150;
    const SEGS = 240;
    const pos = [], idx = [];
    for (let i = 0; i <= RINGS; i++) {
      const r = (i / RINGS) * RMAX;
      for (let j = 0; j <= SEGS; j++) {
        const a = (j / SEGS) * Math.PI * 2;
        const x = ISL.x + Math.cos(a) * r, z = ISL.z + Math.sin(a) * r;
        pos.push(x, bedHeightJS(x, z), z);
      }
    }
    for (let i = 0; i < RINGS; i++)
      for (let j = 0; j < SEGS; j++) {
        const a = i * (SEGS + 1) + j, b = a + SEGS + 1;
        idx.push(a, a + 1, b, a + 1, b + 1, b); // wound to face up
      }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    return geo;
  })(),
  new THREE.ShaderMaterial({
    uniforms: landUniforms,
    vertexShader: /* glsl */ `
      varying vec3 vWorld;
      varying vec3 vN;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorld = wp.xyz;
        vN = normal;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */ `
      ${SKY_GLSL}
      ${NOISE_GLSL}
      ${CLOUD_GLSL}
      ${SHORE_GLSL}
      const float IMP_S = ${IMP_S.toFixed(1)};
      const float IMP_N = ${IMP_N.toFixed(1)};
      uniform sampler2D uImprint;
      uniform vec2 uImpPlayer;
      uniform float uWet;
      uniform vec3 uCamPos;
      uniform float uFogN;
      uniform float uFogF;
      uniform vec3 uLampPos[${MAX_LAMPS}];
      uniform vec3 uLampColor[${MAX_LAMPS}];
      varying vec3 vWorld;
      varying vec3 vN;

      // Fine relief of the sand: wind ripples (bent by noise), lumps and grains
      float sandRelief(vec2 p) {
        vec2 w = vec2(vnoise(p * 0.35), vnoise(p * 0.35 + 7.0)) * 3.0;
        float rip = sin((p.y + w.y) * 5.0 + vnoise(p * 0.9) * 6.0) * 0.5 + 0.5;
        rip *= rip;
        float grain = vnoise(p * 55.0) * 0.6 + vnoise(p * 130.0) * 0.4;
        return rip * 0.02 + grain * 0.004 + vnoise(p * 1.6) * 0.035;
      }
      // Scattered small things on a jittered grid (shells, pebbles, kelp): mask, and a random "kind"
      float scatter(vec2 p, float scale, float prob, float size, out float kind) {
        vec2 cp = p * scale;
        vec2 ci = floor(cp);
        vec2 cf = fract(cp);
        vec2 c = 0.5 + (vec2(hash(ci), hash(ci + 17.3)) - 0.5) * 0.6;
        float sz = size * (0.5 + hash(ci + 41.7));
        kind = hash(ci + 5.1);
        float present = step(1.0 - prob, hash(ci + 3.7));
        return (1.0 - smoothstep(sz * 0.55, sz, length(cf - c))) * present;
      }

      void main() {
        vec3 toCam = uCamPos - vWorld;
        float dist = length(toCam);
        vec3 V = toCam / dist;
        vec2 p = vWorld.xz;
        float y = vWorld.y;
        float near = 1.0 - smoothstep(12.0, 70.0, dist);

        // How far up the beach the swash keeps the sand wet, and where the dune grass takes over
        float tide = swashLevel(p, uTime);
        float wetTop = 0.4 + tide * 1.4 + (vnoise(p * 0.6) - 0.5) * 0.2;
        float gt = smoothstep(1.2, 2.3, y + (fbm(p * 0.1) - 0.5) * 1.7 + (vnoise(p * 2.5) - 0.5) * 0.5);
        gt = smoothstep(0.3, 0.7, gt);
        float wet = (1.0 - smoothstep(wetTop - 0.4, wetTop, y)) * (1.0 - gt);
        wet = max(wet, uWet * 0.55 * (1.0 - gt));
        float shine = (1.0 - smoothstep(tide - 0.02, tide + 0.05, y)) * (1.0 - gt); // sheet of water just left behind

        // Surface normal: the ground's own, plus ripples (fading with distance so far sand doesn't shimmer)
        vec3 N = normalize(vN);
        float e = 0.03;
        float h0 = sandRelief(p);
        vec2 g = vec2(sandRelief(p + vec2(e, 0.0)) - h0, sandRelief(p + vec2(0.0, e)) - h0) / e;
        // marks left in the sand: footprints and drawn lines
        vec2 iuv = p / IMP_S;
        vec2 dw = abs(p - uImpPlayer);
        float inWin = 1.0 - smoothstep(IMP_S * 0.5 - 4.5, IMP_S * 0.5 - 3.0, max(dw.x, dw.y));
        float ipx = 1.0 / IMP_N;
        float I0 = texture2D(uImprint, iuv).r;
        float Ix = texture2D(uImprint, iuv + vec2(ipx, 0.0)).r - texture2D(uImprint, iuv - vec2(ipx, 0.0)).r;
        float Iz = texture2D(uImprint, iuv + vec2(0.0, ipx)).r - texture2D(uImprint, iuv - vec2(0.0, ipx)).r;
        float sandOnly = (1.0 - gt) * inWin * (1.0 - smoothstep(25.0, 40.0, dist));
        I0 *= sandOnly;
        Ix *= sandOnly;
        Iz *= sandOnly;
        g *= mix(1.0, 0.3, wet) * near * (1.0 - gt) * (1.0 - I0);
        g += (vec2(vnoise(p * 14.0), vnoise(p * 14.0 + 5.0)) - 0.5) * 1.6 * gt * near; // grass blades
        N = normalize(N + vec3(-g.x, 0.0, -g.y) * 1.3 + vec3(-Ix, 0.0, -Iz) * 2.2);

        // Sand colour: warm, patchy, with grains, quartz sparkles and dark mineral flecks
        float patchN = vnoise(p * 0.3) * 0.6 + vnoise(p * 1.7) * 0.4;
        vec3 sand = mix(vec3(0.82, 0.70, 0.50), vec3(0.94, 0.86, 0.68), patchN);
        sand *= 0.9 + 0.2 * vnoise(p * 7.0);
        float grainH = hash(floor(p * 160.0));
        sand *= 0.92 + 0.16 * grainH * near + 0.08 * (1.0 - near);
        sand = mix(sand, vec3(0.98, 0.95, 0.88), step(0.987, grainH) * 0.8 * near);
        sand = mix(sand, vec3(0.38, 0.32, 0.26), step(grainH, 0.01) * 0.8 * near);
        float ripCol = sandRelief(p);
        sand *= 0.93 + 3.5 * (ripCol - 0.03) * (1.0 - wet);

        // The high-tide line: shells, pebbles and dark kelp
        float band = smoothstep(0.3, 0.55, y) * (1.0 - smoothstep(0.85, 1.25, y));
        float kind;
        float s1 = scatter(p, 3.0, 0.14, 0.055, kind) * band * near;
        sand = mix(sand, kind < 0.55 ? vec3(0.95, 0.9, 0.84) : vec3(0.3, 0.24, 0.14), s1 * 0.85);
        float s2 = scatter(p + 9.0, 5.5, 0.12, 0.07, kind) * (1.0 - gt) * near;
        sand = mix(sand, mix(vec3(0.5, 0.46, 0.42), vec3(0.72, 0.66, 0.58), kind), s2 * 0.9);

        // Damp sand: darker and richer
        sand = mix(sand, sand * vec3(0.55, 0.5, 0.45), wet);

        // Dune grass: green with dry yellow patches, streaked like blades; a few tufts seeding into the sand
        float blades = vnoise(p * vec2(26.0, 26.0)) * 0.5 + vnoise(p * 60.0) * 0.5;
        vec3 green = mix(vec3(0.22, 0.38, 0.12), vec3(0.45, 0.52, 0.2), vnoise(p * 0.5));
        green = mix(green, vec3(0.62, 0.56, 0.28), smoothstep(0.5, 0.8, fbm(p * 0.07 + 3.0)) * 0.7);
        green *= 0.65 + 0.7 * blades;
        float seed = scatter(p + 21.0, 2.2, 0.35, 0.16, kind) * (1.0 - gt) * smoothstep(0.7, 1.5, y);
        vec3 albedo = mix(sand, vec3(0.3, 0.42, 0.16), seed * 0.85);
        albedo = mix(albedo, green, gt);
        albedo *= mix(1.0, 0.75, uWet * gt);
        albedo *= 1.0 - 0.42 * I0;

        // Light: sun (dimmed by cloud shadows), sky, moon, and nearby lamps
        float cSh = mix(1.0, cloudShadow(vWorld, uSunDir), uSunVis);
        float diff = max(dot(N, uSunDir), 0.0) * uSunVis * cSh;
        vec3 skyA = mix(uHorizon, uTop, 0.4);
        vec3 amb = mix(vec3(dot(skyA, vec3(0.333))), skyA, 0.55) * 0.85 + vec3(0.03, 0.04, 0.075);
        amb *= 0.6 + 0.4 * (N.y * 0.5 + 0.5);
        vec3 moon = vec3(0.3, 0.38, 0.6) * max(dot(N, -uSunDir), 0.0) * uStars * 0.35;
        vec3 col = albedo * (uSunColor * diff * 0.95 + amb * 0.9 + moon);
        for (int i = 0; i < ${MAX_LAMPS}; i++) {
          vec3 L = uLampPos[i] - vWorld;
          float ld = length(L);
          L /= ld;
          float att = 1.0 - smoothstep(0.0, 11.0, ld);
          att *= att;
          col += albedo * uLampColor[i] * att * (0.35 + 0.65 * max(dot(N, L), 0.0));
        }

        // Wet sand shines: sun glints and a reflection of the sky
        vec3 Hh = normalize(V + uSunDir);
        float spec = pow(max(dot(N, Hh), 0.0), 70.0) * uSunVis * cSh;
        float fr = 0.04 + 0.96 * pow(1.0 - max(dot(N, V), 0.0), 5.0);
        vec3 rr = reflect(-V, N);
        rr.y = abs(rr.y);
        float gloss = max(wet * 0.55, shine) * (1.0 - gt);
        col += uSunColor * spec * gloss * 1.4;
        col = mix(col, skyColor(rr) * 0.9, gloss * (0.1 + fr * 0.6));

        col = 1.0 - exp(-col * 1.35); // soft highlights, so bright sun doesn't clip the sand to white
        col = mix(col, uHorizon, smoothstep(uFogN, uFogF, dist));
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  })
);
land.frustumCulled = false;
scene.add(land);
const groundY = (x, z) => bedHeightJS(x, z);

// ----- Palms: a curved trunk and pinnate fronds (a rib with leaflets down both sides) -----
function buildPalm(m, x, z, h, leanAmt, leanDir) {
  const y0 = groundY(x, z) - 0.1;
  const base = new THREE.Vector3(x, y0, z);
  const phase = Math.random() * 6.28;
  plantKind = 0;
  const tmpC = new THREE.Color();
  // Trunk: rings along a bent curve, with darker growth rings
  const SEG = 12, SIDES = 7;
  const pts = [], rad = [];
  for (let i = 0; i <= SEG; i++) {
    const u = i / SEG;
    const off = leanAmt * u * u * h;
    pts.push(new THREE.Vector3(x + Math.cos(leanDir) * off, y0 + u * h, z + Math.sin(leanDir) * off));
    rad.push(lerp(0.2, 0.1, u) + 0.12 * Math.max(0, 1 - u * 9));
  }
  const rings = pts.map((c, i) => {
    const t = new THREE.Vector3().subVectors(pts[Math.min(i + 1, SEG)], pts[Math.max(i - 1, 0)]).normalize();
    const a = new THREE.Vector3().crossVectors(t, new THREE.Vector3(0, 0, 1)).normalize();
    if (a.lengthSq() < 0.5) a.set(1, 0, 0);
    const b = new THREE.Vector3().crossVectors(t, a).normalize();
    return Array.from({ length: SIDES }, (_, s) => {
      const ang = (s / SIDES) * Math.PI * 2;
      const n = a.clone().multiplyScalar(Math.cos(ang)).addScaledVector(b, Math.sin(ang));
      return { p: c.clone().addScaledVector(n, rad[i]), n };
    });
  });
  for (let i = 0; i < SEG; i++) {
    const shade = i % 2 ? 0.78 : 1.0;
    const c0 = new THREE.Color(0x7d6445).multiplyScalar(shade * (0.8 + 0.3 * (i / SEG)));
    const c1 = new THREE.Color(0x7d6445).multiplyScalar((i + 1) % 2 ? 0.78 : 1.0).multiplyScalar(0.8 + 0.3 * ((i + 1) / SEG));
    for (let s = 0; s < SIDES; s++) {
      const s2 = (s + 1) % SIDES;
      const A = rings[i][s], B = rings[i][s2], C = rings[i + 1][s], D = rings[i + 1][s2];
      for (const [P, Q, R, cA, cB, cC] of [[A, B, C, c0, c0, c1], [B, D, C, c0, c1, c1]]) {
        plantVert(m, P.p, P.n, cA, base, h, 0, phase);
        plantVert(m, Q.p, Q.n, cB, base, h, 0, phase);
        plantVert(m, R.p, R.n, cC, base, h, 0, phase);
      }
    }
  }
  plantKind = 1; // Fronds
  const crown = pts[SEG].clone().add(new THREE.Vector3(0, 0.1, 0));
  const nF = 10 + Math.floor(rand(0, 3));
  const UP = new THREE.Vector3(0, 1, 0);
  for (let k = 0; k < nF; k++) {
    const yaw = (k / nF) * Math.PI * 2 + rand(-0.25, 0.25);
    const el = k % 3 === 0 ? rand(0.85, 1.2) : k % 3 === 1 ? rand(-0.1, 0.45) : rand(0.3, 0.75);
    const L = rand(2.5, 3.4);
    const d0 = new THREE.Vector3(Math.cos(el) * Math.cos(yaw), Math.sin(el), Math.cos(el) * Math.sin(yaw));
    const droop = rand(0.9, 1.7) * (1.25 - el * 0.55);
    const N = 13;
    const rib = [];
    for (let j = 0; j <= N; j++) {
      const s = j / N;
      rib.push(crown.clone().addScaledVector(d0, L * s).addScaledVector(UP, -droop * s * s));
    }
    const ph = phase + k * 0.9;
    for (let j = 1; j <= N; j++) {
      const s = j / N;
      const P = rib[j];
      const T = new THREE.Vector3().subVectors(rib[Math.min(j + 1, N)], rib[j - 1]).normalize();
      const S = new THREE.Vector3().crossVectors(T, UP).normalize();
      if (S.lengthSq() < 0.5) S.set(1, 0, 0);
      // the rib itself
      const Pm = rib[j - 1];
      const rc = tmpC.set(0x5b6a35).clone();
      plantTri(m, Pm.clone().addScaledVector(S, -0.025), Pm.clone().addScaledVector(S, 0.025), P.clone().addScaledVector(S, -0.02), rc, rc, rc, base, h, (j - 1) / N * 0.6, (j - 1) / N * 0.6, s * 0.6, ph);
      plantTri(m, Pm.clone().addScaledVector(S, 0.025), P.clone().addScaledVector(S, 0.02), P.clone().addScaledVector(S, -0.02), rc, rc, rc, base, h, (j - 1) / N * 0.6, s * 0.6, s * 0.6, ph);
      // leaflets down both sides, longest in the middle, drooping and swept toward the tip
      for (const sign of [-1, 1]) {
        const dir = S.clone().multiplyScalar(sign * 0.85).addScaledVector(T, 0.5).addScaledVector(UP, -(0.45 + 0.5 * s)).normalize();
        const len = (0.45 + 0.9 * Math.sin(Math.PI * Math.min(1, s * 0.85 + 0.1))) * rand(0.9, 1.15);
        const w = 0.2;
        const p0 = P.clone().addScaledVector(T, -w * 0.5);
        const p1 = P.clone().addScaledVector(T, w * 0.5);
        const p2 = P.clone().addScaledVector(dir, len).addScaledVector(T, w * 0.3);
        const v = rand(0.85, 1.12);
        const cb = new THREE.Color(0x1d4a1a).lerp(new THREE.Color(0x3d7a24), s * 0.7).multiplyScalar(v);
        const ct = new THREE.Color(0x3f7424).lerp(new THREE.Color(0x8aa63a), Math.random() * 0.4 + s * 0.2).multiplyScalar(v);
        plantTri(m, p0, p1, p2, cb, cb, ct, base, h, 0.2 + s * 0.5, 0.2 + s * 0.5, 0.5 + s * 0.8, ph);
      }
    }
  }
  colliders.push({ x, z, r: 0.35 });
}

const palmMesh = (() => {
  const m = plantNew();
  let placed = 0;
  for (let tries = 0; tries < 400 && placed < 22; tries++) {
    const a = rand(0, Math.PI * 2), r = rand(ISL.r * 0.1, ISL.r - 14);
    const x = ISL.x + Math.cos(a) * r, z = ISL.z + Math.sin(a) * r;
    const y = groundY(x, z);
    if (y < 1.1) continue;
    // keep the starting stretch of beach open
    if (Math.hypot(x - ISL.x, z - (ISL.z + ISL.r - 9)) < 16) continue;
    buildPalm(m, x, z, rand(5.5, 8.5), rand(0.1, 0.32), rand(0, Math.PI * 2));
    placed++;
  }
  const mesh = new THREE.Mesh(plantGeometry(m), windMaterial());
  mesh.frustumCulled = false;
  scene.add(mesh);
  return mesh;
})();

// ----- Dune grass: tufts of blades that lean and ripple in the wind -----
const grassMesh = (() => {
  const m = plantNew();
  plantKind = 2;
  const up = new THREE.Vector3(0, 1, 0);
  let tufts = 0;
  for (let tries = 0; tries < 6000 && tufts < 1100; tries++) {
    const a = rand(0, Math.PI * 2), r = rand(ISL.r * 0.05, ISL.r - 3);
    const x = ISL.x + Math.cos(a) * r, z = ISL.z + Math.sin(a) * r;
    const y = groundY(x, z);
    if (y < 1.1 + Math.sin(x * 0.3) * 0.3) continue;
    tufts++;
    const nB = 6;
    for (let b = 0; b < nB; b++) {
      const bx = x + rand(-0.25, 0.25), bz = z + rand(-0.25, 0.25);
      const base = new THREE.Vector3(bx, groundY(bx, bz) - 0.03, bz);
      const hgt = rand(0.35, 0.95);
      const ang = rand(0, Math.PI * 2);
      const lean = new THREE.Vector3(Math.cos(ang), 0, Math.sin(ang)).multiplyScalar(rand(0.05, 0.4) * hgt);
      const side = new THREE.Vector3(-Math.sin(ang + 1.2), 0, Math.cos(ang + 1.2)).multiplyScalar(0.022);
      const mid = base.clone().addScaledVector(up, hgt * 0.55).addScaledVector(lean, 0.35);
      const tip = base.clone().addScaledVector(up, hgt).add(lean);
      const v = rand(0.8, 1.15);
      const cb = new THREE.Color(0x24400f).multiplyScalar(v);
      const cm = new THREE.Color(0x4a6a1c).multiplyScalar(v);
      const ct = new THREE.Color(0x9aa84a).lerp(new THREE.Color(0x6a8a2a), Math.random()).multiplyScalar(v);
      const ph = Math.random() * 6.28;
      const b0 = base.clone().sub(side), b1 = base.clone().add(side);
      const m0 = mid.clone().addScaledVector(side, -0.7), m1 = mid.clone().addScaledVector(side, 0.7);
      plantTri(m, b0, b1, m0, cb, cb, cm, base, hgt, 0, 0, 0.35, ph);
      plantTri(m, b1, m1, m0, cb, cm, cm, base, hgt, 0, 0.35, 0.35, ph);

  const mesh = new THREE.Mesh(plantGeometry(m), windMaterial());

})();

{
