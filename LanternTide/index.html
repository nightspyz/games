// ----- Palms: a curved trunk and pinnate fronds (a rib with leaflets down both sides) -----
function buildPalm(m, x, z, h, leanAmt, leanDir) {
  const y0 = groundY(x, z) - 0.1;
  const base = new THREE.Vector3(x, y0, z);
  const phase = Math.random() * 6.28;
  plantKind = 0;
  const tmpC = new THREE.Color();
  // Trunk: rings along a bent curve, with darker growth rings
  const SEG = 12, SIDES = 7;
  const pts = [], rad = [];
  for (let i = 0; i <= SEG; i++) {
    const u = i / SEG;
    const off = leanAmt * u * u * h;
    pts.push(new THREE.Vector3(x + Math.cos(leanDir) * off, y0 + u * h, z + Math.sin(leanDir) * off));
    rad.push(lerp(0.2, 0.1, u) + 0.12 * Math.max(0, 1 - u * 9));
  }
  const rings = pts.map((c, i) => {
    const t = new THREE.Vector3().subVectors(pts[Math.min(i + 1, SEG)], pts[Math.max(i - 1, 0)]).normalize();
    const a = new THREE.Vector3().crossVectors(t, new THREE.Vector3(0, 0, 1)).normalize();
    if (a.lengthSq() < 0.5) a.set(1, 0, 0);
    const b = new THREE.Vector3().crossVectors(t, a).normalize();
    return Array.from({ length: SIDES }, (_, s) => {
      const ang = (s / SIDES) * Math.PI * 2;
      const n = a.clone().multiplyScalar(Math.cos(ang)).addScaledVector(b, Math.sin(ang));
      return { p: c.clone().addScaledVector(n, rad[i]), n };
    });
  });
  for (let i = 0; i < SEG; i++) {
    const shade = i % 2 ? 0.78 : 1.0;
    const c0 = new THREE.Color(0x7d6445).multiplyScalar(shade * (0.8 + 0.3 * (i / SEG)));
    const c1 = new THREE.Color(0x7d6445).multiplyScalar((i + 1) % 2 ? 0.78 : 1.0).multiplyScalar(0.8 + 0.3 * ((i + 1) / SEG));
    for (let s = 0; s < SIDES; s++) {
      const s2 = (s + 1) % SIDES;
      const A = rings[i][s], B = rings[i][s2], C = rings[i + 1][s], D = rings[i + 1][s2];
      for (const [P, Q, R, cA, cB, cC] of [[A, B, C, c0, c0, c1], [B, D, C, c0, c1, c1]]) {
        plantVert(m, P.p, P.n, cA, base, h, 0, phase);
        plantVert(m, Q.p, Q.n, cB, base, h, 0, phase);
        plantVert(m, R.p, R.n, cC, base, h, 0, phase);
      }
    }
  }
  plantKind = 1; // Fronds
  const crown = pts[SEG].clone().add(new THREE.Vector3(0, 0.1, 0));
  const nF = 10 + Math.floor(rand(0, 3));
  const UP = new THREE.Vector3(0, 1, 0);
  for (let k = 0; k < nF; k++) {
    const yaw = (k / nF) * Math.PI * 2 + rand(-0.25, 0.25);
    const el = k % 3 === 0 ? rand(0.85, 1.2) : k % 3 === 1 ? rand(-0.1, 0.45) : rand(0.3, 0.75);
    const L = rand(2.5, 3.4);
    const d0 = new THREE.Vector3(Math.cos(el) * Math.cos(yaw), Math.sin(el), Math.cos(el) * Math.sin(yaw));
    const droop = rand(0.9, 1.7) * (1.25 - el * 0.55);
    const N = 13;
    const rib = [];
    for (let j = 0; j <= N; j++) {
      const s = j / N;
      rib.push(crown.clone().addScaledVector(d0, L * s).addScaledVector(UP, -droop * s * s));
    }
    const ph = phase + k * 0.9;
    for (let j = 1; j <= N; j++) {
      const s = j / N;
      const P = rib[j];
      const T = new THREE.Vector3().subVectors(rib[Math.min(j + 1, N)], rib[j - 1]).normalize();
      const S = new THREE.Vector3().crossVectors(T, UP).normalize();
      if (S.lengthSq() < 0.5) S.set(1, 0, 0);
      // the rib itself
      const Pm = rib[j - 1];
      const rc = tmpC.set(0x5b6a35).clone();
      plantTri(m, Pm.clone().addScaledVector(S, -0.025), Pm.clone().addScaledVector(S, 0.025), P.clone().addScaledVector(S, -0.02), rc, rc, rc, base, h, (j - 1) / N * 0.6, (j - 1) / N * 0.6, s * 0.6, ph);
      plantTri(m, Pm.clone().addScaledVector(S, 0.025), P.clone().addScaledVector(S, 0.02), P.clone().addScaledVector(S, -0.02), rc, rc, rc, base, h, (j - 1) / N * 0.6, s * 0.6, s * 0.6, ph);
      // leaflets down both sides, longest in the middle, drooping and swept toward the tip
      for (const sign of [-1, 1]) {
        const dir = S.clone().multiplyScalar(sign * 0.85).addScaledVector(T, 0.5).addScaledVector(UP, -(0.45 + 0.5 * s)).normalize();
        const len = (0.45 + 0.9 * Math.sin(Math.PI * Math.min(1, s * 0.85 + 0.1))) * rand(0.9, 1.15);
        const w = 0.2;
        const p0 = P.clone().addScaledVector(T, -w * 0.5);
        const p1 = P.clone().addScaledVector(T, w * 0.5);
        const p2 = P.clone().addScaledVector(dir, len).addScaledVector(T, w * 0.3);
        const v = rand(0.85, 1.12);
        const cb = new THREE.Color(0x1d4a1a).lerp(new THREE.Color(0x3d7a24), s * 0.7).multiplyScalar(v);
        const ct = new THREE.Color(0x3f7424).lerp(new THREE.Color(0x8aa63a), Math.random() * 0.4 + s * 0.2).multiplyScalar(v);
        plantTri(m, p0, p1, p2, cb, cb, ct, base, h, 0.2 + s * 0.5, 0.2 + s * 0.5, 0.5 + s * 0.8, ph);
      }
    }
  }
  colliders.push({ x, z, r: 0.35 });
}

const grassMesh = (() => {

  plantKind = 2;
  const up = new THREE.Vector3(0, 1, 0);
  let tufts = 0;
  for (let tries = 0; tries < 6000 && tufts < 1100; tries++) {
    const a = rand(0, Math.PI * 2), r = rand(ISL.r * 0.05, ISL.r - 3);
    const x = ISL.x + Math.cos(a) * r, z = ISL.z + Math.sin(a) * r;
    const y = groundY(x, z);
    if (y < 1.1 + Math.sin(x * 0.3) * 0.3) continue;
    tufts++;
    const nB = 6;
    for (let b = 0; b < nB; b++) {
      const bx = x + rand(-0.25, 0.25), bz = z + rand(-0.25, 0.25);
      const base = new THREE.Vector3(bx, groundY(bx, bz) - 0.03, bz);
      const hgt = rand(0.35, 0.95);
      const ang = rand(0, Math.PI * 2);
      const lean = new THREE.Vector3(Math.cos(ang), 0, Math.sin(ang)).multiplyScalar(rand(0.05, 0.4) * hgt);
      const side = new THREE.Vector3(-Math.sin(ang + 1.2), 0, Math.cos(ang + 1.2)).multiplyScalar(0.022);
      const mid = base.clone().addScaledVector(up, hgt * 0.55).addScaledVector(lean, 0.35);
      const tip = base.clone().addScaledVector(up, hgt).add(lean);
      const v = rand(0.8, 1.15);
      const cb = new THREE.Color(0x24400f).multiplyScalar(v);
      const cm = new THREE.Color(0x4a6a1c).multiplyScalar(v);
      const ct = new THREE.Color(0x9aa84a).lerp(new THREE.Color(0x6a8a2a), Math.random()).multiplyScalar(v);
      const ph = Math.random() * 6.28;
      const b0 = base.clone().sub(side), b1 = base.clone().add(side);
      const m0 = mid.clone().addScaledVector(side, -0.7), m1 = mid.clone().addScaledVector(side, 0.7);
      plantTri(m, b0, b1, m0, cb, cb, cm, base, hgt, 0, 0, 0.35, ph);
      plantTri(m, b1, m1, m0, cb, cm, cm, base, hgt, 0, 0.35, 0.35, ph);
      plantTri(m, m0, m1, tip, cm, cm, ct, base, hgt, 0.35, 0.35, 0.8, ph);
    }
  }
  const mesh = new THREE.Mesh(plantGeometry(m), windMaterial());
  mesh.frustumCulled = false;
  scene.add(mesh);
  return mesh;
})();

{

      tp.setXYZ(k, tp.getX(k) * f + Math.sin(y * 1.1 + seed) * 0.06, y, tp.getZ(k) * f + Math.cos(y * 0.8 + seed) * 0.05);

// ===== Lighthouse on the dunes =====
const lighthouse = (() => {
  const x = ISL.x + 4, z = ISL.z - 6;
  const y = bedHeightJS(x, z);
  const group = new THREE.Group();
  group.position.set(x, y - 0.3, z);
  const H = 15;

  // The tower's skin, painted per pixel: a dressed-stone foot, whitewashed plaster with rain streaks and grime,
  // red bands with chipped paint, small arched windows (lit at night) and a heavy door facing the sea.
  const TW = 512, TH = 704;
  const mk = () => {
    const c = document.createElement("canvas");
    c.width = TW;
    c.height = TH;
    const ctx = c.getContext("2d");
    return { c, ctx, img: ctx.createImageData(TW, TH) };
  };
  const cMap = mk(), cBump = mk(), cEmit = mk();
  const WINDOWS = [[0.12, 0.3], [0.62, 0.3], [0.37, 0.52], [0.87, 0.52], [0.12, 0.74], [0.62, 0.74]];
  const BASE = 0.07;
  for (let py = 0; py < TH; py++)
    for (let px = 0; px < TW; px++) {
      const u = px / TW, v = 1 - py / TH;
      const ang = u * 6.283;
      const cx = Math.cos(ang) * 4, cz = Math.sin(ang) * 4; // wraps around the tower seamlessly
      const n = jfbm(cx + 3, cz + 3, v * 38, 3);
      const streak = jnoise(cx * 3, cz * 3, v * 3);
      let r, g, b, bump = 0.5 + 0.12 * n, em = 0;
      if (v < BASE) {
        // stone blocks, staggered rows
        const row = Math.floor(v / 0.0175);
        const col = (u * 22 + (row % 2) * 0.5) % 1;
        const rowF = (v / 0.0175) % 1;
        const mortar = col < 0.05 || rowF < 0.09;
        const k = 0.55 + 0.5 * n + 0.15 * jnoise(Math.floor(u * 22 + (row % 2) * 0.5) * 3.7, row * 5.1, 1);
        r = 0.5 * k; g = 0.47 * k; b = 0.43 * k;
        if (mortar) { r *= 0.55; g *= 0.55; b *= 0.55; bump = 0.18; }
        else bump = 0.55 + 0.2 * n;
        // green slime near the ground and salt stains
        const slime = smooth(0.03, 0.0, v) * jnoise(cx * 2, cz * 2, 5);
        r = lerp(r, 0.18, slime * 0.5); g = lerp(g, 0.3, slime * 0.5); b = lerp(b, 0.14, slime * 0.5);
      } else {
        const band = Math.floor((v - BASE) / ((1 - BASE) / 5));
        const red = band % 2 === 1;
        let k = 0.88 + 0.18 * n;
        // dirt and rain-streaks running down, heavier toward the bottom
        const dirt = (0.04 + 0.2 * smooth(0.45, 0.0, v)) * smooth(0.4, 0.8, streak);
        if (red) {
          r = 0.74 * k; g = 0.12 * k; b = 0.1 * k;
          const chip = jnoise(cx * 7 + 9, cz * 7, v * 70);
          if (chip > 0.87) { r = 0.78; g = 0.75; b = 0.7; bump = 0.3; } // paint flaking off to the plaster
          const edge = (v - BASE) / ((1 - BASE) / 5) % 1;
          if (edge < 0.025 || edge > 0.975) { r = 0.55; g = 0.08; b = 0.07; } // painted line between bands
        } else {
          r = 0.94 * k; g = 0.93 * k; b = 0.88 * k;
        }
        r *= 1 - dirt; g *= 1 - dirt; b *= 1 - dirt * 0.9;
        // windows
        for (const [wu, wv] of WINDOWS) {
          const du = Math.abs(u - wu) * 11.3, dv = (v - wv) * 15;
          const inShape = (e) => (dv <= 0.5 ? du < 0.4 + e && dv > -0.7 - e : (du / (0.4 + e)) ** 2 + ((dv - 0.5) / (0.4 + e)) ** 2 < 1);
          const inRect = inShape(0), inFrame = inShape(0.15);
          if (inRect) { r = 0.05; g = 0.07; b = 0.09; bump = 0.25; em = 0.9 + 0.1 * n; }
          else if (inFrame) { r = 0.82; g = 0.8; b = 0.74; bump = 0.8; }
        }
      }
      // the door, facing south (u wraps around 0)
      const du = Math.min(u, 1 - u) * 11.3, dv = v * 15;
      if (v < 0.17 && du < 0.78 + 0.07 && (dv < 2.2 - 0.1 || du * du / 0.55 + (dv - 1.55) * (dv - 1.55) / 0.55 < 1.05)) {
        const inDoor = du < 0.64 && (dv < 1.6 || du * du / 0.41 + (dv - 1.6) * (dv - 1.6) / 0.5 < 1);
        if (inDoor) {
          const plank = Math.abs(Math.sin(du * 14)) < 0.06;
          const kk = (0.55 + 0.4 * jnoise(du * 9, dv * 2, 7)) * (plank ? 0.5 : 1);
          r = 0.3 * kk; g = 0.17 * kk; b = 0.08 * kk; bump = plank ? 0.2 : 0.55;
          if (Math.abs(dv - 0.6) < 0.05 || Math.abs(dv - 1.4) < 0.05) { r = 0.1; g = 0.1; b = 0.11; bump = 0.75; } // iron straps
        } else { r = 0.78; g = 0.75; b = 0.7; bump = 0.8; }
      }
      const i = (py * TW + px) * 4;
      cMap.img.data[i] = clamp(r, 0, 1) * 255; cMap.img.data[i + 1] = clamp(g, 0, 1) * 255; cMap.img.data[i + 2] = clamp(b, 0, 1) * 255; cMap.img.data[i + 3] = 255;
      const bv = clamp(bump, 0, 1) * 255;
      cBump.img.data[i] = cBump.img.data[i + 1] = cBump.img.data[i + 2] = bv; cBump.img.data[i + 3] = 255;
      cEmit.img.data[i] = em * 255; cEmit.img.data[i + 1] = em * 190; cEmit.img.data[i + 2] = em * 90; cEmit.img.data[i + 3] = 255;
    }
  const tex = (m) => {
    m.ctx.putImageData(m.img, 0, 0);
    const t = new THREE.CanvasTexture(m.c);
    t.wrapS = THREE.RepeatWrapping;
    t.anisotropy = 4;
    return t;
  };
  const towerMat = new THREE.MeshStandardMaterial({ map: tex(cMap), bumpMap: tex(cBump), bumpScale: 2.2, emissiveMap: tex(cEmit), emissive: 0xffffff, emissiveIntensity: 0, roughness: 0.82, metalness: 0 });
  const prof = [];
  for (let i = 0; i <= 28; i++) {
    const v = i / 28;
    prof.push(new THREE.Vector2(lerp(2.35, 1.35, v) + 0.25 * Math.max(0, 1 - v / 0.05), v * H));
  }
  group.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 56), towerMat));

  // Gallery: iron deck with a railing, then the lantern room with glazing bars and a copper dome
  const iron = new THREE.MeshStandardMaterial({ color: 0x23282c, roughness: 0.5, metalness: 0.7 });
  const deck = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 1.7, 0.3, 40), iron);
  deck.position.y = H + 0.05;
  group.add(deck);
  const rail = [];
  for (let i = 0; i < 32; i++) {
    const a = (i / 32) * 6.283;
    rail.push({ g: new THREE.CylinderGeometry(0.018, 0.018, 1.0, 5).translate(Math.cos(a) * 2.0, H + 0.7, Math.sin(a) * 2.0) });
  }
  rail.push({ g: new THREE.TorusGeometry(2.0, 0.03, 6, 40).rotateX(Math.PI / 2).translate(0, H + 1.2, 0) });
  rail.push({ g: new THREE.TorusGeometry(2.0, 0.02, 6, 40).rotateX(Math.PI / 2).translate(0, H + 0.8, 0) });
  group.add(new THREE.Mesh(mergeGeos(rail), iron));
  const lanternMat = new THREE.MeshStandardMaterial({ color: 0xffe9b0, emissive: 0xffd070, emissiveIntensity: 0.3, transparent: true, opacity: 0.88, roughness: 0.15 });
  const lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 1.5, 24), lanternMat);
  lamp.position.y = H + 1.0;
  group.add(lamp);
  const bars = [];
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * 6.283;
    bars.push({ g: new THREE.BoxGeometry(0.05, 1.55, 0.05).translate(Math.cos(a) * 0.96, H + 1.0, Math.sin(a) * 0.96) });
  }
  bars.push({ g: new THREE.TorusGeometry(0.96, 0.04, 6, 24).rotateX(Math.PI / 2).translate(0, H + 1.78, 0) });
  bars.push({ g: new THREE.TorusGeometry(0.96, 0.04, 6, 24).rotateX(Math.PI / 2).translate(0, H + 0.24, 0) });
  group.add(new THREE.Mesh(mergeGeos(bars), iron));
  const copper = new THREE.MeshStandardMaterial({ map: copperTex, roughness: 0.55, metalness: 0.5 });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(1.2, 28, 12, 0, Math.PI * 2, 0, Math.PI / 2), copper);
  dome.position.y = H + 1.78;
  group.add(dome);
  const fin = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), copper);
  fin.position.y = H + 3.0;
  group.add(fin);
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.02, 0.9, 6), iron);
  rod.position.y = H + 3.45;
  group.add(rod);

  // Two beams that sweep around the horizon: open-ended cones that start at the lamp, widen as they travel,
  // fade out along their length and at their edges, and glow most when they point toward you
  const BEAM_L = 280;
  const beamUniforms = { uCam: { value: new THREE.Vector3() }, uLamp: { value: new THREE.Vector3() }, uOpacity: { value: 0 }, uTime: shared.uTime, uLen: { value: BEAM_L } };
  const beamMat = new THREE.ShaderMaterial({
    uniforms: beamUniforms,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    vertexShader: /* glsl */ `
      uniform float uLen;
      varying float vAlong;
      varying vec3 vWorld;
      varying vec3 vNW;
      varying vec3 vAxis;
      void main() {
        vAlong = clamp(position.x / uLen, 0.0, 1.0);
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorld = wp.xyz;
        vNW = normalize(mat3(modelMatrix) * normal);
        vAxis = normalize(mat3(modelMatrix) * vec3(1.0, 0.0, 0.0));
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */ `
      uniform vec3 uCam;
      uniform vec3 uLamp;
      uniform float uOpacity;
      uniform float uTime;
      varying float vAlong;
      varying vec3 vWorld;
      varying vec3 vNW;
      varying vec3 vAxis;
      void main() {
        vec3 V = normalize(uCam - vWorld);
        float rim = pow(abs(dot(normalize(vNW), V)), 1.4);                    // soft edges: thickest through the middle
        float len = pow(1.0 - vAlong, 1.8) * smoothstep(0.0, 0.025, vAlong); // bright at the lamp, gone by the open end
        float toward = max(dot(vAxis, normalize(uCam - uLamp)), 0.0);
        float fwd = 0.35 + 1.8 * pow(toward, 3.0);                            // light scatters forward, toward the viewer
        float dust = 0.9 + 0.1 * sin(vAlong * 60.0 - uTime * 2.0);
        gl_FragColor = vec4(1.0, 0.94, 0.8, uOpacity * len * rim * fwd * dust);
      }
    `,
  });
  const beams = new THREE.Group();
  beams.position.y = H + 1.0;
  for (const rot of [0, Math.PI]) {
    const geo = new THREE.CylinderGeometry(0, 18, BEAM_L, 32, 12, true);
    geo.translate(0, -BEAM_L / 2, 0); // apex on the lamp
    geo.rotateZ(Math.PI / 2);         // lay it along +x
    const m = new THREE.Mesh(geo, beamMat);
    m.rotation.y = rot;
    m.frustumCulled = false;
    beams.add(m);
  }
  group.add(beams);
  // The lamp's flare, which swells as a beam sweeps toward you
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0xffe2a0, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  glow.position.y = H + 1.0;
  group.add(glow);
  scene.add(group);
  return { group, beams, beamUniforms, towerMat, lanternMat, glow, lampY: H + 1.0 };
})();

// ===== Round soft-glow texture, for lights and sprites =====
const dotTexture = (() => {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.2, "rgba(255,255,255,0.7)");
  grad.addColorStop(0.5, "rgba(255,255,255,0.18)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);

})();
lighthouse.glow.material.map = dotTexture;

// ===== Weather =====
// Coastline's weather: a forecast that moves between clear, cloud, rain and storm, plus separate "fog days" that
// thicken and thin. Each visit starts at a random point in it.
const WEATHER_TARGETS = [0.1, 0.1, 0.35, 0.6, 0.95];
const _fogDay = Math.random() < 0.05; // (rare: a fog day buries the whole world in grey)
const _w0 = _fogDay ? 0.1 : WEATHER_TARGETS[Math.floor(Math.random() * WEATHER_TARGETS.length)];
const weather = { fogDay: _fogDay, timer: rand(20, 50), fogTimer: rand(60, 120), fog: _fogDay ? 0.45 : 0, fogTarget: _fogDay ? 0.45 : 0, value: _w0, target: _w0, windAngle: -Math.PI / 2, windSpeed: 6, flash: 0, secondFlash: -1, strikeTimer: 6, cloudOffset: new THREE.Vector2(), auto: true, autoTimer: 70 };
const wx = { cover: 0, overcast: 0, rain: 0, storm: 0, fog: 0 };

// ----- Rain -----
const RAIN_COUNT = 3000, RAIN_BOX = 60, RAIN_HEIGHT = 36;
const rainDrops = new Float32Array(RAIN_COUNT * 3);
for (let i = 0; i < RAIN_COUNT; i++) {
  rainDrops[i * 3] = rand(-RAIN_BOX / 2, RAIN_BOX / 2);
  rainDrops[i * 3 + 1] = rand(-5, RAIN_HEIGHT - 5);
  rainDrops[i * 3 + 2] = rand(-RAIN_BOX / 2, RAIN_BOX / 2);
}
const rainPos = new Float32Array(RAIN_COUNT * 6);
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute("position", new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.LineBasicMaterial({ color: 0xaab4c0, transparent: true, opacity: 0.4, fog: false, depthWrite: false });
const rain = new THREE.LineSegments(rainGeo, rainMat);
rain.frustumCulled = false;
rain.renderOrder = 2;
scene.add(rain);
const wrapTo = (v, center, size) => (v < center - size / 2 ? v + size : v > center + size / 2 ? v - size : v);
const camPos = new THREE.Vector3();
function updateRain(dt, lightLevel) {
  const active = Math.floor(RAIN_COUNT * wx.rain);
  rain.visible = active > 0;
  if (!rain.visible) return;
  const vx = Math.cos(weather.windAngle) * weather.windSpeed * 0.5;
  const vz = Math.sin(weather.windAngle) * weather.windSpeed * 0.5;
  const vy = -22;
  for (let i = 0; i < active; i++) {
    let x = rainDrops[i * 3] + vx * dt;
    let y = rainDrops[i * 3 + 1] + vy * dt;
    let z = rainDrops[i * 3 + 2] + vz * dt;
    x = wrapTo(x, camPos.x, RAIN_BOX);
    z = wrapTo(z, camPos.z, RAIN_BOX);
    const rainFloor = Math.max(camPos.y - 10, 0.3);
    if (y < rainFloor) y += RAIN_HEIGHT;
    if (y > rainFloor + RAIN_HEIGHT) y -= RAIN_HEIGHT;
    rainDrops[i * 3] = x;
    rainDrops[i * 3 + 1] = y;
    rainDrops[i * 3 + 2] = z;
    const j = i * 6;
    rainPos[j] = x;
    rainPos[j + 1] = y;
    rainPos[j + 2] = z;
    rainPos[j + 3] = x - vx * 0.04;
    rainPos[j + 4] = y - vy * 0.04;
    rainPos[j + 5] = z - vz * 0.04;
  }
  rainGeo.setDrawRange(0, active * 2);
  rainGeo.attributes.position.needsUpdate = true;
  rainMat.opacity = 0.25 + 0.25 * wx.storm;
  rainMat.color.setRGB(0.67, 0.71, 0.75).multiplyScalar(Math.max(lightLevel, 0.25) + weather.flash);
}

// ----- Lightning -----
const BOLT_POINTS = 24;
const boltGeo = new THREE.BufferGeometry();
boltGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(BOLT_POINTS * 3), 3));
const boltMat = new THREE.LineBasicMaterial({ color: 0xe8f0ff, transparent: true, fog: false });
const bolt = new THREE.Line(boltGeo, boltMat);
bolt.frustumCulled = false;
bolt.visible = false;
scene.add(bolt);
function strike() {
  const a = Math.random() * Math.PI * 2;
  const dist = rand(250, 700);
  let x = camPos.x + Math.cos(a) * dist;
  let z = camPos.z + Math.sin(a) * dist;
  const pos = boltGeo.attributes.position;
  for (let i = 0; i < BOLT_POINTS; i++) {
    pos.setXYZ(i, x, 300 - (302 * i) / (BOLT_POINTS - 1), z);
    x += rand(-12, 12);
    z += rand(-12, 12);
  }
  pos.needsUpdate = true;
  weather.flash = 1;
  audio.thunder(dist);
  weather.secondFlash = Math.random() < 0.6 ? rand(0.1, 0.25) : -1;
}

function updateWeather(dt) {
  if (weather.locked) weather.timer = weather.fogTimer = 30; // (a weather you picked from the menu stays put)
  weather.timer -= dt;
  if (weather.timer <= 0) {
    // Fog days stay calm (fog and wind don't go together)
    const targets = weather.fogDay ? [0.1, 0.1, 0.35] : WEATHER_TARGETS;
    weather.target = targets[Math.floor(Math.random() * targets.length)];
    weather.timer = rand(45, 95);
  }
  // On a fog day the fog bank thickens and thins; now and then it lifts enough to see a little farther
  weather.fogTimer -= dt;
  if (weather.fogTimer <= 0) {
    weather.fogTarget = weather.fogDay ? (Math.random() < 0.5 ? 0.6 : 0.3) : 0;
    weather.fogTimer = rand(60, 120);
  }
  const fogStep = (weather.locked ? 0.04 : 0.01) * dt;
  weather.fog += clamp(weather.fogTarget - weather.fog, -fogStep, fogStep);
  const valStep = (weather.locked ? 0.05 : 0.015) * dt;
  weather.value += clamp(weather.target - weather.value, -valStep, valStep);
  weather.windAngle += rand(-0.5, 0.5) * 0.05 * dt;
  weather.windAngle = clamp(weather.windAngle, -Math.PI / 2 - 0.6, -Math.PI / 2 + 0.6); // always blowing toward the island, more or less
  const w = weather.value;
  wx.cover = 0.32 + 0.68 * smooth(0.0, 0.7, w);
  wx.overcast = smooth(0.25, 0.85, w);
  wx.rain = smooth(0.4, 0.65, w);
  wx.storm = smooth(0.75, 0.95, w);
  wx.fog = weather.fog;
  // Wind drives the waves and the clouds
  weather.windSpeed = 3 + 21 * w;
  waveScale = (0.55 + 1.45 * w) * waveMul;
  weather.cloudOffset.x += Math.cos(weather.windAngle) * weather.windSpeed * 1.5 * dt;
  weather.cloudOffset.y += Math.sin(weather.windAngle) * weather.windSpeed * 1.5 * dt;
  if (wx.storm > 0.2) {
    weather.strikeTimer -= dt;
    if (weather.strikeTimer <= 0) {
      strike();
      weather.strikeTimer = 3 + Math.random() * 10 * (1.2 - wx.storm);
    }
  }
  weather.flash = Math.max(0, weather.flash - dt * 5);
  if (weather.secondFlash > 0) {
    weather.secondFlash -= dt;
    if (weather.secondFlash <= 0) weather.flash = 0.8;
  }
  bolt.visible = weather.flash > 0.25;
  boltMat.opacity = weather.flash;
}

// ----- Time of day + weather lighting -----
const PALETTE = {
  nightTop: new THREE.Color(0x02050f),
  nightHorizon: new THREE.Color(0x0b1630),
  duskTop: new THREE.Color(0x35508e),
  duskHorizon: new THREE.Color(0xff9444),
  dayTop: new THREE.Color(0x2f6fd0),
  dayHorizon: new THREE.Color(0xb8dcf3),
  overcastTop: new THREE.Color(0x4f5761),
  overcastHorizon: new THREE.Color(0x7d858e),
  flash: new THREE.Color(0xc8d4ff),
  fog: new THREE.Color(0xc3cacf),
  sunLow: new THREE.Color(0xff8a32),
  sunHigh: new THREE.Color(0xfff3dd),
  deepWater: new THREE.Color(0x0b3553),
  shallowWater: new THREE.Color(0x1f7a8c),
  stormDeep: new THREE.Color(0x1a2a2e),
  stormShallow: new THREE.Color(0x3c5a5a),
};
const tmpColor = new THREE.Color();
function sunDirection(hours, out) {
  const a = ((hours - 6) / 24) * Math.PI * 2; // 6:00 sunrise, 12:00 highest, 18:00 sunset
  return out.set(Math.cos(a), Math.sin(a) * 0.9, 0.35).normalize();
}
const lastEnv = { light: 1, lightLevel: 1, lampsOn: 0 };
function applyEnvironment(hours) {
  const sunDir = sunDirection(hours, shared.uSunDir.value);
  {
    // the moon: opposite the sun, swinging a little to one side and back over time, so it has phases from space
    const mt = 0.55 * Math.sin(shared.uTime.value * 0.004);
    const px = sunDir.y, py = -sunDir.x, pl = Math.hypot(px, py) || 1;
    shared.uMoonDir.value.set(-sunDir.x + (px / pl) * mt, -sunDir.y + (py / pl) * mt, -sunDir.z).normalize();
  }
  const e = sunDir.y;
  const day = smooth(0.0, 0.35, e);
  const night = 1 - smooth(-0.28, -0.02, e);
  const light = smooth(-0.2, 0.3, e);
  const lightLevel = 0.06 + 0.94 * light;
  const flash = weather.flash;

  const top = shared.uTop.value, horizon = shared.uHorizon.value;
  top.copy(PALETTE.duskTop).lerp(PALETTE.nightTop, night).lerp(PALETTE.dayTop, day);
  horizon.copy(PALETTE.duskHorizon).lerp(PALETTE.nightHorizon, night).lerp(PALETTE.dayHorizon, day);
  top.lerp(tmpColor.copy(PALETTE.overcastTop).multiplyScalar(lightLevel), wx.overcast * 0.85);
  horizon.lerp(tmpColor.copy(PALETTE.overcastHorizon).multiplyScalar(lightLevel), wx.overcast * 0.85);
  if (wx.fog > 0) {
    // fog: everything fades into a soft grey-white
    tmpColor.copy(PALETTE.fog).multiplyScalar(lightLevel);
    top.lerp(tmpColor, wx.fog * 0.5);
    horizon.lerp(tmpColor, wx.fog * 0.65);
  }
  if (flash > 0) {
    top.lerp(PALETTE.flash, flash * 0.6);
    horizon.lerp(PALETTE.flash, flash * 0.5);
  }

  {
    // high up the sky thins to black
    const sd = spaceState.dark;
    if (sd > 0) {
      top.lerp(tmpColor.setRGB(0, 0, 0), sd);
      horizon.lerp(tmpColor.setRGB(0, 0, 0), Math.pow(sd, 0.8));
    }
  }
  shared.uSunColor.value.copy(PALETTE.sunLow).lerp(PALETTE.sunHigh, day);
  shared.uSunset.value = (1 - smooth(0.0, 0.55, e > 0 ? e : -e * 2.2)) * (1 - 0.8 * wx.overcast); // a long, colourful sunset and twilight
  shared.uSunVis.value = smooth(-0.04, 0.02, e) * (1 - 0.9 * wx.overcast) * (1 - 0.75 * wx.fog);
  shared.uFog.value = wx.fog;
  shared.uStars.value = Math.max(night * (1 - wx.overcast) * (1 - wx.fog), smooth(0.3, 0.85, spaceState.dark));
  shared.uAurora.value = opts.aurora * night * (1 - wx.cover) * (1 - wx.fog) * (0.75 + 0.25 * Math.sin(shared.uTime.value * 0.03));
  shared.uCloudCover.value = wx.cover * (1 - spaceState.cloudFade);
  // god rays are strongest with a low sun partly hidden by broken cloud
  shared.uRays.value = (1 - spaceState.cloudFade) * smooth(-0.12, 0.06, e) * (1 - 0.55 * smooth(0.3, 0.9, e)) * (0.3 + 0.7 * wx.cover) * (1 - 0.75 * smooth(0.55, 0.95, wx.overcast)) * (1 - wx.fog);
  shared.uCloudDark.value = smooth(0.35, 0.95, weather.value);
  shared.uCloudOffset.value.copy(weather.cloudOffset);
  shared.uLightLevel.value = Math.max(lightLevel, 0.08) + flash * 0.8;

  waterUniforms.uLight.value = lightLevel * (1 - 0.3 * wx.overcast) + flash * 0.3;
  waterUniforms.uWaveScale.value = waveScale;
  waterUniforms.uFoam.value = 0.35 + 0.4 * wx.storm;
  waterUniforms.uDeep.value.copy(PALETTE.deepWater).lerp(PALETTE.stormDeep, wx.overcast);
  waterUniforms.uShallow.value.copy(PALETTE.shallowWater).lerp(PALETTE.stormShallow, wx.overcast);

  // Rain cuts visibility
  waterUniforms.uFogNear.value = lerp(FOG_NEAR * (1 - 0.6 * wx.rain), 25, wx.fog) + spaceState.alt * 0.5;
  waterUniforms.uFogFar.value = lerp(FOG_FAR - 90 * wx.rain, 420, wx.fog) + spaceState.alt * 6;
  scene.fog.near = lerp(lerp(120, 40, wx.rain), 25, wx.fog);
  scene.fog.far = lerp(lerp(1500, 450, wx.rain), 420, wx.fog) + spaceState.alt * 8;
  landUniforms.uFogN.value = scene.fog.near;
  landUniforms.uFogF.value = scene.fog.far;
  landUniforms.uWet.value = wx.rain;
  scene.fog.color.copy(horizon);
  renderer.setClearColor(horizon);

  sunLight.color.copy(shared.uSunColor.value);
  sunLight.intensity = 1.1 * smooth(-0.02, 0.2, e) * (1 - 0.75 * wx.overcast);
  sunLight.intensity *= cloudShadowJS(player.x, 0, player.z, sunDir, wx.cover, weather.cloudOffset) * opts.sunI;
  shared.uSunColor.value.multiplyScalar(opts.sunI);
  shared.uMoonI.value = opts.moonI;
  sunLight.position.copy(sunDir).multiplyScalar(100);
  moonLight.position.copy(shared.uMoonDir.value).multiplyScalar(100);
  moonLight.intensity = 0.3 * night * (1 - wx.overcast) * opts.moonI;
  hemiLight.color.copy(horizon).lerp(top, 0.5);
  hemiLight.groundColor.copy(waterUniforms.uDeep.value).multiplyScalar(lightLevel);
  hemiLight.intensity = (0.25 + 0.45 * light) * (1 - 0.35 * wx.overcast) + flash * 1.5;

  // Lamps come on at dusk and in dark weather
  const lampsOn = Math.max(1 - smooth(-0.05, 0.1, e), wx.overcast * 0.8 * (1 - day * 0.5));
  lighthouse.lanternMat.emissiveIntensity = 0.3 + 2 * lampsOn;
  lastEnv.light = light;
  lastEnv.lightLevel = lightLevel;
  lastEnv.lampsOn = lampsOn;
  return lastEnv;
}

function updateLighthouse(dt, lampsOn) {
  lighthouse.beams.rotation.y += dt * 0.9;
  lighthouse.beams.visible = lampsOn > 0.02;
  lighthouse.towerMat.emissiveIntensity = 1.2 * lampsOn;
  lighthouse.beams.getWorldPosition(lighthouse.beamUniforms.uLamp.value);
  lighthouse.beamUniforms.uCam.value.copy(camPos);
  lighthouse.beamUniforms.uOpacity.value = 0.5 * lampsOn * (0.6 + 2.0 * wx.rain);
  // The lamp flares when a beam sweeps toward the camera
  const toCamX = camPos.x - lighthouse.group.position.x;
  const toCamZ = camPos.z - lighthouse.group.position.z;
  const len = Math.hypot(toCamX, toCamZ) || 1;
  const rot = lighthouse.beams.rotation.y;
  const facing = Math.abs(Math.cos(rot) * (toCamX / len) - Math.sin(rot) * (toCamZ / len));
  const flare = Math.pow(facing, 40);
  lighthouse.glow.visible = lampsOn > 0.02;
  lighthouse.glow.material.opacity = lampsOn;
  const size = 8 + 90 * flare;
  lighthouse.glow.scale.set(size, size, 1);
}

let islKey = "";
function updateIslUniforms(x, z) {
  const j0 = Math.floor((z - GRID_OZ) / CELL) - 1;
  const ib = [0, 1, 2].map((r) => Math.floor((x - GRID_OX - rowOff(j0 + r)) / CELL) - 1);
  const key = j0 + "|" + ib.join(",");
  if (key === islKey) return;
  islKey = key;
  shared.uIslBase.value.set(0, j0);
  shared.uIslRowI.value.set(ib[0], ib[1], ib[2]);

      s.stop(t0 + 4);

// ===== Under the water: seagrass, kelp, corals and schools of fish =====
// Makes a material look like it's under the water when below the surface: colours fade with the
// distance travelled through the water (red first), and it blends in less at grazing angles.
// wag > 0 also swishes the tail end of the mesh (for fish).
function applyUnderwater(material, wag = 0, minA = 0) {
  material.transparent = true;
  material.customProgramCacheKey = () => "underwater-" + wag + "-" + minA;
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = shared.uTime;
    shader.uniforms.uLight = waterUniforms.uLight;
    shader.uniforms.uUnder = shared.uUnder;
    shader.uniforms.uUnderCol = shared.uUnderCol;
    shader.vertexShader =
      (wag ? "attribute float aPhase;\nuniform float uTime;\n" : "") +
      "varying vec3 vUW;\n" +
      shader.vertexShader
        .replace(
          "#include <begin_vertex>",
          `#include <begin_vertex>
          ${wag ? `transformed.x += sin(uTime * 14.0 + aPhase) * ${wag.toFixed(3)} * smoothstep(-0.05, 0.3, transformed.z);` : ""}`
        )
        .replace(
          "#include <fog_vertex>",
          `#include <fog_vertex>
          vec4 uwPos = vec4(transformed, 1.0);
          #ifdef USE_INSTANCING
            uwPos = instanceMatrix * uwPos;
          #endif
          vUW = (modelMatrix * uwPos).xyz;`
        );
    shader.fragmentShader =
      "uniform float uLight;\nuniform float uTime;\nuniform float uUnder;\nuniform vec3 uUnderCol;\nvarying vec3 vUW;\n" +
      shader.fragmentShader.replace(
        "#include <fog_fragment>",
        `float below = -vUW.y;
        if (uUnder > 0.5) {
          // the camera is under the water: things fade into the murk by how far away they are
          vec3 absorbC = exp(-length(vUW - cameraPosition) * vec3(0.2, 0.07, 0.05));
          gl_FragColor.rgb = gl_FragColor.rgb * absorbC + uUnderCol * (1.0 - absorbC);
        } else if (below > 0.0) {
          vec3 rd = normalize(vUW - cameraPosition);
          float pathLen = below / max(-rd.y, 0.08);
          // Caustics: sunlight focused by the waves, dancing over surfaces that face up
          float facing = abs(normalize(cross(dFdx(vUW), dFdy(vUW)) + vec3(1e-6)).y); // how much the surface faces up
          float cw = sin(vUW.x * 1.7 + sin(vUW.z * 1.3 + uTime * 0.9) * 1.5 + uTime)
                   * sin(vUW.z * 1.9 + sin(vUW.x * 1.1 - uTime * 0.7) * 1.5 - uTime * 0.8);
          gl_FragColor.rgb *= 1.0 + 0.7 * pow(max(cw, 0.0), 3.0) * facing * exp(-below * 0.12) * uLight;
          // colour fades with depth, red first, into bright turquoise, so things match the floor they sit on
          vec3 absorb = exp(-below * vec3(0.32, 0.1, 0.07));
          vec3 inscatter = vec3(0.2, 0.85, 0.9) * uLight;
          gl_FragColor.rgb = gl_FragColor.rgb * absorb + inscatter * (1.0 - absorb);
          // Solid up close; only the surface reflection at a low angle, and distance, fade them out
          float fres = 0.02 + 0.98 * pow(1.0 - abs(rd.y), 5.0);
          gl_FragColor.a = max(gl_FragColor.a * (1.0 - fres) * (1.0 - smoothstep(25.0, 45.0, pathLen)), ${minA.toFixed(2)}); // (solid things keep most of their body: they blend by colour, not see-through)
        }
        #include <fog_fragment>`
      );
  };
  return material;
}

function hash2(x, z) {
  const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
  return s - Math.floor(s);

function noise2(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return (a * (1 - ux) + b * ux) * (1 - uz) + (c * (1 - ux) + d * ux) * uz;

// Makes a material look like it's under the water (see applyUnderwater above)
// ===== A tiny mesh kit: smooth-shaded parts with a colour per vertex, merged into one geometry =====
const v3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  norm: (a) => {
    const l = Math.hypot(a[0], a[1], a[2]) || 1;
    return [a[0] / l, a[1] / l, a[2] / l];
  },
};

function reefMesh() {
  const pos = [];
  const nor = [];
  const col = [];
  // A grid of vertices; f(i, j) gives { p: [x, y, z], c: [r, g, b] }. wrap joins the last column to the first.
  function grid(rows, cols, f, wrap = false) {
    const V = [];
    const C = [];
    for (let i = 0; i < rows; i++)
      for (let j = 0; j < cols; j++) {
        const v = f(i, j);
        V.push(v.p);
        C.push(v.c);
      }
    const at = (i, j) => i * cols + (wrap ? j % cols : j);
    const tris = [];
    for (let i = 0; i < rows - 1; i++)
      for (let j = 0; j < (wrap ? cols : cols - 1); j++) {
        tris.push([at(i, j), at(i + 1, j), at(i, j + 1)], [at(i, j + 1), at(i + 1, j), at(i + 1, j + 1)]);
      }
    // Smooth normals (the materials are two-sided, so which way they face doesn't matter)
    const N = V.map(() => [0, 0, 0]);
    for (const [a, b, c] of tris) {
      const n = v3.cross(v3.sub(V[b], V[a]), v3.sub(V[c], V[a]));
      for (const k of [a, b, c]) for (let q = 0; q < 3; q++) N[k][q] += n[q];
    }
    const Nn = N.map(v3.norm);
    for (const t of tris)
      for (const k of t) {
        pos.push(...V[k]);
        nor.push(...Nn[k]);
        col.push(...C[k]);
      }
  }
  // An ellipsoid (or part of one, from latitude lat0 to lat1, 0 = top), dented by disp(dir) and coloured by color(dir)
  function blob(c, r, lat0, lat1, segLat, segLon, disp = () => 1, color = () => [1, 1, 1]) {
    grid(
      segLat + 1,
      segLon,
      (i, j) => {
        const th = lat0 + ((lat1 - lat0) * i) / segLat;
        const ph = (2 * Math.PI * j) / segLon;
        const d = [Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph)];
        const k = disp(d);
        return { p: [c[0] + d[0] * r[0] * k, c[1] + d[1] * r[1] * k, c[2] + d[2] * r[2] * k], c: color(d) };
      },
      true
    );
  }
  // A tapered tube from a to b
  function tube(a, b, r0, r1, sides, c0, c1) {
    const axis = v3.norm(v3.sub(b, a));
    const helper = Math.abs(axis[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    const u = v3.norm(v3.cross(axis, helper));
    const w = v3.cross(axis, u);
    grid(
      2,
      sides,
      (i, j) => {
        const ang = (2 * Math.PI * j) / sides;
        const r = i ? r1 : r0;
        const ring = v3.add(v3.mul(u, Math.cos(ang) * r), v3.mul(w, Math.sin(ang) * r));
        return { p: v3.add(i ? b : a, ring), c: i ? c1 : c0 };
      },
      true
    );
  }
  // A flat strip from a to b, width w, lying in the plane with normal n
  function ribbon(a, b, w0, w1, n, c0, c1) {
    const side = v3.norm(v3.cross(v3.sub(b, a), n));
    grid(2, 2, (i, j) => {
      const half = (i ? w1 : w0) / 2;
      return { p: v3.add(i ? b : a, v3.mul(side, j ? half : -half)), c: i ? c1 : c0 };
    });
  }
  return {
    blob,
    tube,
    ribbon,
    data: () => ({ position: new Float32Array(pos), normal: new Float32Array(nor), color: new Float32Array(col) }),
  };
}

// Seeded random numbers, so every tile of reef grows the same way each time it's filled in
function seededRandom(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

// ===== The shapes (about 1 m across; each placed copy is scaled and tinted) =====
// Table coral: a broad flat plate on a short stalk, paler at the growing rim; sometimes a second tier
function shapeTable(rng) {
  const m = reefMesh();
  m.tube([0, 0, 0], [0.05, 0.5, 0], 0.16, 0.1, 6, grey(0.45), grey(0.6));
  const plate = (c, r, seed) =>
    m.blob(
      c,
      [r, 0.08, r * 0.92],
      0,
      Math.PI,
      5,
      14,
      (d) => 1 + 0.08 * (bumps(d, 3, seed) - 0.5),
      // Radial ridges of growing branches, a pale growing rim, darker underneath
      (d) => {
        if (d[1] < -0.2) return grey(0.42);
        const radial = Math.abs(Math.sin(Math.atan2(d[2], d[0]) * 23 + bumps(d, 5, seed) * 4));
        return grey(0.62 + 0.18 * radial + 0.4 * Math.pow(1 - Math.abs(d[1]), 3) + 0.12 * (bumps(d, 9, seed) - 0.5));
      }
    );

  if (rng() < 0.45) {
    m.tube([0.05, 0.3, 0], [0.45, 0.32, 0.2], 0.08, 0.06, 5, grey(0.45), grey(0.55));
    plate([0.55, 0.32, 0.25], 0.55, rng() * 50);

  for (let k = 0; k < lumps; k++) {

    const c = k ? [rand(-0.7, 0.7), -0.05, rand(-0.7, 0.7)] : [0, -0.05, 0];

      c,
      [r, r * 0.72, r * 0.9],

const REEF_KIND = Object.fromEntries(REEF_KINDS.map((K) => [K.id, K]));

// ===== Where the reef grows: a shelf of patches all round the island, and boulders along its rocky edge =====
const NO_REEF = { coral: 0, rock: 0 };
const reefNoise = (x, z) => noise2(x, z) * 0.6 + noise2(x * 2.1 + 5.3, z * 2.1 + 1.7) * 0.4;
function reefWeights(x, z) {
  const d = shoreDistAll(x, z); // metres out to sea (from the nearest island)
  if (d < 1) return NO_REEF;
  const shelf = smooth(10, 26, d) * (1 - smooth(120, 190, d));
  const rockZone = smooth(1, 6, d) * (1 - smooth(30, 60, d));
  if (shelf + rockZone < 0.01) return NO_REEF;
  const patch = shelf > 0 ? shelf * smooth(0.4, 0.55, reefNoise(x * 0.012, z * 0.012)) : 0;
  const coral = patch > 0 ? patch * smooth(0.34, 0.54, reefNoise(x * 0.07 + 3.1, z * 0.07 + 7.7)) : 0;
  const rock = rockZone > 0 ? rockZone * smooth(0.4, 0.6, reefNoise(x * 0.05 + 11, z * 0.05 + 5)) : 0;
  return { coral, rock };
}

// the island whose shore is nearest a point (the home island, or the one in this cell)

const REEF_TILE = 20;
const REEF_RADIUS = 100; // underwater things fade out before this
const reefTiles = new Map();

// Everything growing on one tile of sea floor: [{ kind, shape, x, y, z, yaw, tiltX, tiltZ, scale, color }]
function reefTile(tx, tz) {
  const key = tx + "," + tz;
  let items = reefTiles.get(key);
  if (items) return items;
  items = [];
  const rng = seededRandom(Math.imul(tx, 73856093) ^ Math.imul(tz, 19349663) ^ 0x5bd1e995);
  const add = (kind, x, z, bed, depth, scaleMul) => {
    if (depth < 1.0) return false; // not in the shallows (or on land)
    if (Math.hypot(x - HARBOR.x, z - HARBOR.z) < 24) return false; // keep the harbour basin clear
    const K = REEF_KIND[kind];
    // Never let it reach the surface
    let scale = (K.size[0] + (K.size[1] - K.size[0]) * rng() ** 1.5) * scaleMul;
    scale = Math.min(scale, (depth - 0.7) / K.height);
    if (scale < 0.3) return false;
    items.push({
      kind,
      shape: Math.floor(rng() * K.shapes.length),
      x,
      y: bed - 0.06 * scale,
      z,
      yaw: rng() * Math.PI * 2,
      tiltX: (rng() - 0.5) * 0.2,
      tiltZ: (rng() - 0.5) * 0.2,
      scale,
      color: K.colors[Math.floor(rng() * K.colors.length)].map((c) => c * (0.85 + 0.25 * rng())),
    });

  };
  const pickCoral = (depth, roll) => {
    const mix = depth < 6 ? REEF_MIX_SHALLOW : REEF_MIX_DEEP;
    let acc = 0;
    for (const id in mix) {
      acc += mix[id];
      if (roll < acc) return id;
    }
    return "boulder";
  };
  for (let k = 0; k < 40; k++) {
    const x = (tx + rng()) * REEF_TILE;
    const z = (tz + rng()) * REEF_TILE;
    const roll = rng();
    const pickRoll = rng();
    const bed = bedHeightJS(x, z);
    const depth = -bed;
    if (depth < 1.0 || depth > 26) continue;
    const w = reefWeights(x, z);
    if (roll < w.rock * 0.25 || roll > 0.997) {
      add("rock", x, z, bed, depth, w.rock > 0.8 ? 1.6 : 1);
    } else if (roll < w.rock * 0.25 + w.coral * 0.9 * (1 - 0.6 * smooth(7, 18, depth))) {
      if (!add(pickCoral(depth, pickRoll), x, z, bed, depth, 1)) continue;

        const r = 0.7 + rng() * 1.6;
        const fx = x + Math.cos(a) * r;
        const fz = z + Math.sin(a) * r;
        const fb = bedHeightJS(fx, fz);
        add(pickCoral(-fb, rng()), fx, fz, fb, -fb, 0.6 + 0.3 * rng());

}

// The tiles around (x, z), nearest first
function reefTilesAround(x, z) {
  const ctx = Math.floor(x / REEF_TILE);
  const ctz = Math.floor(z / REEF_TILE);
  const n = Math.ceil(REEF_RADIUS / REEF_TILE) + 1;
  const tiles = [];
  for (let i = -n; i <= n; i++)
    for (let j = -n; j <= n; j++) {
      const d = Math.hypot((ctx + i + 0.5) * REEF_TILE - x, (ctz + j + 0.5) * REEF_TILE - z);
      if (d < REEF_RADIUS + REEF_TILE) tiles.push({ tx: ctx + i, tz: ctz + j, d });
    }

}

// ===== Drawing: one instanced mesh per shape =====
const reefMat = applyUnderwater(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, metalness: 0, side: THREE.DoubleSide }), 0, 0.88);

for (const K of REEF_KINDS) {
  reefMeshes[K.id] = K.shapes.map((build, i) => {
    const data = build(seededRandom(1000 + i * 77 + K.id.length * 13));
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(data.position, 3));
    geo.setAttribute("normal", new THREE.BufferAttribute(data.normal, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(data.color, 3));
    const cap = Math.ceil(K.cap / K.shapes.length);
    const mesh = new THREE.InstancedMesh(geo, reefMat, cap);
    // Every mesh gets its colours from the start. They all share one material, and three.js builds its shader

    mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(cap * 3).fill(1), 3);
    mesh.count = 0;

    mesh.renderOrder = 1.5; // after the water, like the other underwater things

const reefState = { tile: null, dirty: false };
const _rm = new THREE.Matrix4();
const _rq = new THREE.Quaternion();
const _re = new THREE.Euler();
const _rp = new THREE.Vector3();
const _rs = new THREE.Vector3();

// Refill the reef around the camera when it moves onto another tile. New tiles are grown a couple per
// frame, nearest first, so there's never a pause; the far ones (barely visible) fill in a moment later.
function updateReef() {
  const cx = camPos.x;
  const cz = camPos.z;
  const tile = Math.floor(cx / REEF_TILE) + "," + Math.floor(cz / REEF_TILE);
  if (tile !== reefState.tile) {
    reefState.tile = tile;
    reefState.dirty = true;
  }
  if (!reefState.dirty) return;
  const start = performance.now();
  let missing = false;
  for (const t of reefTilesAround(cx, cz)) {
    if (reefTiles.has(t.tx + "," + t.tz)) continue;
    if (performance.now() - start > 4) {
      missing = true; // the rest next frame
      break;
    }
    reefTile(t.tx, t.tz);
  }
  reefState.dirty = missing;
  for (const id in reefMeshes) for (const mesh of reefMeshes[id]) mesh.count = 0;
  const items = [];
  for (const t of reefTilesAround(cx, cz)) {
    const tileItems = reefTiles.get(t.tx + "," + t.tz);
    if (tileItems) for (const it of tileItems) if (Math.hypot(it.x - cx, it.z - cz) < REEF_KIND[it.kind].range) items.push(it);
  }
  for (const it of items) {
    const mesh = reefMeshes[it.kind][it.shape];
    if (mesh.count >= mesh.instanceMatrix.count) continue;
    _re.set(it.tiltX, it.yaw, it.tiltZ);
    _rm.compose(_rp.set(it.x, it.y, it.z), _rq.setFromEuler(_re), _rs.set(it.scale, it.scale, it.scale));
    mesh.setMatrixAt(mesh.count, _rm);
    mesh.setColorAt(mesh.count, _rc.setRGB(it.color[0], it.color[1], it.color[2]));
    mesh.count++;
  }
  for (const id in reefMeshes)
    for (const mesh of reefMeshes[id]) {
      mesh.instanceMatrix.needsUpdate = true;
      mesh.instanceColor.needsUpdate = true;
    }
  // Forget tiles far behind, so the cache doesn't grow forever
  if (reefTiles.size > 2500) {
    for (const key of reefTiles.keys()) {
      const [tx, tz] = key.split(",").map(Number);
      if (Math.hypot((tx + 0.5) * REEF_TILE - cx, (tz + 0.5) * REEF_TILE - cz) > 600) reefTiles.delete(key);
    }
  }
}

const kelp = (() => {

  const pos = [];

    const a0 = (r / 3) * Math.PI * 2 + 0.4;

      const w = (0.09 + 0.16 * Math.sin(Math.PI * Math.min(1, t * 1.3))) * (1 + 0.25 * Math.sin(t * 31 + r)); // wavy edge
      const cx = Math.cos(a0) * off * (1 + t * 2.5);
      const cz = Math.sin(a0) * off * (1 + t * 2.5);
      const ex = Math.cos(a + Math.PI / 2) * w;
      const ez = Math.sin(a + Math.PI / 2) * w;
      pos.push(cx - ex, t, cz - ez, cx + ex, t, cz + ez);
      const shade = 0.45 + 0.55 * t; // darker down in the gloom
      col.push(shade, shade, shade, shade, shade, shade);

    }

  for (let k = 0, tries = 0; k < K.count && tries < K.count * 6; tries++) {
    const a = rand(0, Math.PI * 2);
    const want = pickDepth();
    for (let r = ISL.r + 4; r < ISL.r + 280; r += 2) {
      const x = ISL.x + Math.cos(a) * r;
      const z = ISL.z + Math.sin(a) * r;
      const y = bedHeightJS(x, z);
      if (y > -want) continue;

        spots.push({ x, z, y, len: -y + rand(-0.6, 2.6) }); // up to the surface; the longest spread out along it

  // kelp leans one way then the other, the top swinging furthest
  const swayGLSL = WAVES.slice(0, 3)
    .map((w) => `s += vec2(${w.dx.toFixed(4)}, ${w.dz.toFixed(4)}) * ${(w.a * 1.6).toFixed(4)} * cos(${w.k.toFixed(5)} * (${w.dx.toFixed(4)} * wp.x + ${w.dz.toFixed(4)} * wp.z - ${w.c.toFixed(4)} * uTime));`)

  const build = (spots, parent) => {

  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const e = new THREE.Euler();
  const sc = new THREE.Vector3();
  const v = new THREE.Vector3();
  const c = new THREE.Color();
  spots.forEach((p, i) => {
    const wide = rand(0.9, 1.6);
    mesh.setMatrixAt(i, m.compose(v.set(p.x, p.y - 0.2, p.z), q.setFromEuler(e.set(0, rand(0, Math.PI * 2), 0)), sc.set(wide, p.len, wide)));

const SPLASH_COUNT = 400;

    splashPos[i * 3 + 2] = z + Math.sin(a) * 0.3;
    splashVel[i * 3] = Math.cos(a) * r;
    splashVel[i * 3 + 1] = rand(0.5, 1) * power;
    splashVel[i * 3 + 2] = Math.sin(a) * r;
    splashLife[i] = rand(0.5, 1.1);
  }
}
function updateSplashes(dt) {
  for (let i = 0; i < SPLASH_COUNT; i++) {
    if (splashLife[i] <= 0) continue;
    splashLife[i] -= dt;
    splashVel[i * 3 + 1] -= 9.8 * dt;
    splashPos[i * 3] += splashVel[i * 3] * dt;
    splashPos[i * 3 + 1] += splashVel[i * 3 + 1] * dt;
    splashPos[i * 3 + 2] += splashVel[i * 3 + 2] * dt;
    if (splashLife[i] <= 0) splashPos[i * 3 + 1] = -1000;
  }
  splashGeo.attributes.position.needsUpdate = true;
}

// ===== Fish that leap out of the water and glide above the waves =====
const fishMat = applyUnderwater(new THREE.MeshStandardMaterial({ color: 0xb8c4cc, metalness: 0.6, roughness: 0.3 }));
function buildFish() {
  const g = new THREE.Group();
  g.rotation.order = "YXZ";
  const bodyGeo = new THREE.SphereGeometry(1, 8, 6);
  bodyGeo.scale(0.09, 0.14, 0.35);
  g.add(new THREE.Mesh(bodyGeo, fishMat));
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.2, 0.12), fishMat);
  tail.position.z = 0.38;
  g.add(tail);
  return shapeModel("fish", g);
}
const fishes = [];
for (let i = 0; i < 8; i++) {
  const mesh = buildFish();
  mesh.visible = false;
  scene.add(mesh);
  fishes.push({ mesh, active: false, x: 0, z: 0, yaw: 0, t: 0, dur: 1, height: 1, speed: 5 });
}
let fishTimer = 1;
const boil = { x: 0, z: 0, timer: 0 }; // a shoal feeding near the surface out at sea, where fish leap
function moveBoil() {
  const I = curIsland(camPos.x, camPos.z);
  const home = Math.atan2(camPos.z - I.z, camPos.x - I.x);
  for (let k = 0; k < 40; k++) {
    const a = I.a ? home + rand(-1.4, 1.4) : Math.PI / 2 + rand(-1.4, 1.4);
    const r = (I.a ? isleCoastR(I.a, a) : I.r) + rand(60, 200);
    const x = I.x + Math.cos(a) * r, z = I.z + Math.sin(a) * r;
    if (bedHeightJS(x, z) < -3) {
      boil.x = x;
      boil.z = z;
      break;
    }
  }
  boil.timer = rand(90, 180);
}
function updateLeapFish(dt, t) {
  boil.timer -= dt;
  if (boil.timer <= 0 || Math.hypot(boil.x - camPos.x, boil.z - camPos.z) > 450) moveBoil();
  fishTimer -= dt;
  if (fishTimer <= 0) {
    fishTimer = rand(0.5, 2.2);
    const f = fishes.find((fish) => !fish.active);
    if (f) {
      const a = Math.random() * Math.PI * 2;
      const r = rand(0, 22);
      f.active = true;
      f.x = boil.x + Math.cos(a) * r;
      f.z = boil.z + Math.sin(a) * r;
      f.yaw = Math.random() * Math.PI * 2;
      f.t = 0;
      f.dur = rand(2.2, 3.4);
      f.height = rand(0.6, 1.1);
      f.speed = rand(7, 10);
      f.mesh.visible = true;
      splash(f.x, waveHeight(f.x, f.z, t), f.z, 8, 1.5);
    }
  }
  for (const f of fishes) {
    if (!f.active) continue;
    f.t += dt;
    const u = f.t / f.dur;
    if (u >= 1) {
      f.active = false;
      f.mesh.visible = false;
      splash(f.x, waveHeight(f.x, f.z, t), f.z, 8, 1.5);
      continue;
    }
    f.x -= Math.sin(f.yaw) * f.speed * dt;
    f.z -= Math.cos(f.yaw) * f.speed * dt;
    // Up out of the water, a long glide just above the waves, then back in
    const lift = Math.min(1, Math.sin(Math.PI * u) * 3);
    const rel = -0.2 + (f.height + 0.2) * lift;
    const vy = u < 0.12 ? 3 : u > 0.88 ? -3 : 0;
    f.mesh.position.set(f.x, waveHeight(f.x, f.z, t) + rel, f.z);
    f.mesh.rotation.set(Math.atan2(vy, f.speed), f.yaw, Math.sin(f.t * 30) * 0.2);
  }
}

// ===== Reef fish schools (orange anthias swimming over the reef near the shore) =====
const SCHOOL_COUNT = 3;
const FISH_PER_SCHOOL = 90;
function buildReefFishGeometries() {
  // Body: a lathed, laterally flattened teardrop, nose toward -Z
  const profile = [];
  for (let i = 0; i <= 12; i++) {
    const t = i / 12;
    profile.push(new THREE.Vector2(Math.max(0.001, 0.11 * Math.sin(Math.PI * Math.pow(t, 0.8))), -0.2 + t * 0.4));
  }
  const body = new THREE.LatheGeometry(profile, 10);
  body.rotateX(Math.PI / 2);
  body.scale(0.45, 1, 1);
  // Forked tail fin behind the body
  const tail = new THREE.BufferGeometry();
  tail.setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0.17, 0, 0.12, 0.36, 0, 0.02, 0.29, 0, 0, 0.17, 0, -0.02, 0.29, 0, -0.12, 0.36], 3));
  tail.computeVertexNormals();
  return { body, tail };
}
const reefFishGeo = buildReefFishGeometries();
const reefBodyMat = applyUnderwater(new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.45 }), 0.03);
const reefTailMat = applyUnderwater(new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, side: THREE.DoubleSide }), 0.09);
const TOTAL_REEF_FISH = SCHOOL_COUNT * FISH_PER_SCHOOL;
const fishPhases = new Float32Array(TOTAL_REEF_FISH).map(() => rand(0, Math.PI * 2));
reefFishGeo.body.setAttribute("aPhase", new THREE.InstancedBufferAttribute(fishPhases, 1));
reefFishGeo.tail.setAttribute("aPhase", new THREE.InstancedBufferAttribute(fishPhases, 1));
const reefBodies = new THREE.InstancedMesh(reefFishGeo.body, reefBodyMat, TOTAL_REEF_FISH);
const reefTails = new THREE.InstancedMesh(reefFishGeo.tail, reefTailMat, TOTAL_REEF_FISH);
reefBodies.frustumCulled = false;
reefTails.frustumCulled = false;
reefBodies.renderOrder = reefTails.renderOrder = 1.5;
{
  const col = new THREE.Color();
  for (let i = 0; i < TOTAL_REEF_FISH; i++) {
    const r = Math.random();
    if (r < 0.85) col.setHSL(rand(0.03, 0.08), 0.95, rand(0.5, 0.6)); // orange
    else if (r < 0.93) col.setHSL(rand(0.12, 0.15), 0.95, 0.55); // yellow
    else col.setHSL(rand(0.75, 0.82), 0.6, 0.55); // purple

    reefTails.setColorAt(i, col);
  }
}
scene.add(reefBodies, reefTails);

// Each school hangs around a spot out from wherever you are on the shore, kept over water at least a few
// metres deep, and wanders slowly.
const schools = [
  { offT: -16, offR: 0 },
  { offT: 18, offR: 14 },
  { offT: 2, offR: 30 },
].map((s, i) => ({
  ...s,
  x: 0,
  z: -200,
  y: -3,
  heading: 0,
  placed: false,
  seed: i * 13.7,
  vx: 0,
  vz: 0,
  // Every fish swims on its own: it keeps its own position, speed and heading, and follows its place in
  // the school with its own reaction time, so a turn ripples through the school instead of all at once
  fish: Array.from({ length: FISH_PER_SCHOOL }, () => ({
    ox: rand(-1, 1) * 4,
    oy: rand(-1, 1) * 0.8,
    oz: rand(-1, 1) * 6,
    phase: rand(0, Math.PI * 2),
    scale: rand(0.8, 1.2),
    x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,
    heading: 0,
    slotHeading: 0, // the school's heading as this fish has noticed it
    react: rand(0.6, 2.2), // how quickly it notices the school turning (rad/s)
    turn: rand(2.2, 4), // how fast it can turn (rad/s)
    maxSpeed: rand(4.6, 6.2), // always faster than the school (up to 4 m/s), so nobody gets left behind
  })),
}));
const fishMatrix = new THREE.Matrix4();
const fishQuat = new THREE.Quaternion();
const fishEuler = new THREE.Euler(0, 0, 0, "YXZ");
const fishPos = new THREE.Vector3();
const fishScale = new THREE.Vector3();
function updateReefFish(dt, t) {
  const I = curIsland(camPos.x, camPos.z);
  const pdx = camPos.x - I.x, pdz = camPos.z - I.z;
  const pl = Math.hypot(pdx, pdz) || 1;
  const Rc = I.a ? isleCoastR(I.a, Math.atan2(pdz, pdx)) : I.r;
  const nearShore = pl - Rc > -40 && pl - Rc < 170;
  reefBodies.visible = reefTails.visible = nearShore;
  if (!nearShore) {
    for (const s of schools) s.placed = false;
    return;
  }
  const ux = pdx / pl, uz = pdz / pl; // out from the island, toward you
  const tx = -uz, tz = ux;
  let idx = 0;
  schools.forEach((s, si) => {
    // Target: out from your stretch of shore, wandering, pushed out to water at least 3 m deep
    const R0 = Math.max(Rc + 26, pl) + s.offR + Math.sin(t * 0.1 + s.seed) * 10;
    const lat = s.offT + Math.cos(t * 0.13 + s.seed) * 14;
    let gx = I.x + ux * R0 + tx * lat;
    let gz = I.z + uz * R0 + tz * lat;
    for (let k = 0; k < 30 && bedHeightJS(gx, gz) > -3; k++) {
      gx += ux * 4;
      gz += uz * 4;
    }
    const fresh = !s.placed;
    if (fresh) {
      s.x = gx;
      s.z = gz;
      s.placed = true;
    }
    const dx = gx - s.x;
    const dz = gz - s.z;
    const dist = Math.hypot(dx, dz);
    const speed = Math.min(dist * 0.5, 4);
    s.vx = dist > 0.01 ? (dx / dist) * speed : 0;
    s.vz = dist > 0.01 ? (dz / dist) * speed : 0;
    s.x += s.vx * dt;
    s.z += s.vz * dt;
    // Face the way the school moves; drift around slowly when it's idle
    const desired = speed > 0.3 ? Math.atan2(-dx, -dz) : s.heading + dt * 0.3;
    s.heading += clamp(wrapAngle(desired - s.heading), -dt * 1.2, dt * 1.2);
    const bed = bedHeightJS(s.x, s.z);
    const targetY = clamp(bed + 2.5, -6, -1.2);
    s.y += (targetY - s.y) * (1 - Math.exp(-dt));

    const follow = 1 - Math.exp(-dt * 2.5);
    s.fish.forEach((f, fi) => {
      // The fish's place in the school, turned by the school's heading as this fish has noticed it
      f.slotHeading += clamp(wrapAngle(s.heading - f.slotHeading), -f.react * dt, f.react * dt);
      const ch = Math.cos(f.slotHeading);
      const sh = Math.sin(f.slotHeading);
      const lx = f.ox + Math.sin(t * 0.8 + f.phase) * 0.6;
      const lz = f.oz + Math.cos(t * 0.6 + f.phase) * 0.8;
      const px = s.x + lx * ch + lz * sh;
      const py = s.y + f.oy + Math.sin(t * 1.3 + f.phase) * 0.2;
      const pz = s.z - lx * sh + lz * ch;
      if (fresh) Object.assign(f, { x: px, y: py, z: pz, vx: 0, vy: 0, vz: 0, heading: s.heading, slotHeading: s.heading });
      // Swim toward that place, going with the school's flow, never faster than this fish can
      let wx = (px - f.x) * 1.2 + s.vx;
      let wy = (py - f.y) * 1.2;
      let wz = (pz - f.z) * 1.2 + s.vz;
      // Keep a little space from a neighbour
      const n = s.fish[(fi + 1) % s.fish.length];
      const sx = f.x - n.x, sy = f.y - n.y, sz = f.z - n.z;
      const sd = Math.hypot(sx, sy, sz);
      if (sd < 0.6 && sd > 1e-4) {
        wx += (sx / sd) * (0.6 - sd) * 4;
        wy += (sy / sd) * (0.6 - sd) * 4;
        wz += (sz / sd) * (0.6 - sd) * 4;
      }
      const ws = Math.hypot(wx, wy, wz);
      if (ws > f.maxSpeed) {
        wx *= f.maxSpeed / ws;
        wy *= f.maxSpeed / ws;
        wz *= f.maxSpeed / ws;
      }
      f.vx += (wx - f.vx) * follow;
      f.vy += (wy - f.vy) * follow;
      f.vz += (wz - f.vz) * follow;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.z += f.vz * dt;
      // Turn to face where it's swimming, at its own pace; when idling, drift toward the school's heading
      const hs = Math.hypot(f.vx, f.vz);
      const want = hs > 0.25 ? Math.atan2(-f.vx, -f.vz) : f.slotHeading;
      f.heading += clamp(wrapAngle(want - f.heading), -f.turn * dt, f.turn * dt);
      const pitch = clamp(Math.atan2(f.vy, Math.max(hs, 0.3)), -0.5, 0.5);
      fishPos.set(f.x, f.y, f.z);
      fishEuler.set(pitch + Math.sin(t * 0.9 + f.phase) * 0.05, f.heading, 0);
      fishQuat.setFromEuler(fishEuler);
      fishScale.setScalar(f.scale);
      fishMatrix.compose(fishPos, fishQuat, fishScale);
      reefBodies.setMatrixAt(idx, fishMatrix);
      reefTails.setMatrixAt(idx, fishMatrix);
      idx++;
    });
  });
  reefBodies.instanceMatrix.needsUpdate = true;
  reefTails.instanceMatrix.needsUpdate = true;
}

// ===== The boat (Coastline's 8.6 m cabin cruiser), moored at a small dock =====
const BOAT_LEN = { stern: 4.0, bow: -4.6 };
const boatT = (z) => (z - BOAT_LEN.stern) / (BOAT_LEN.bow - BOAT_LEN.stern); // 0 at the stern, 1 at the bow
const boatHalfBeam = (z) => {
  const t = boatT(z);
  return 1.45 * (t < 0.5 ? 1 - 0.06 * t : Math.pow(Math.max(Math.cos(((t - 0.5) / 0.5) * Math.PI * 0.5), 0), 0.75));
};
const boatSheer = (z) => 1.15 + 0.5 * Math.pow(boatT(z), 2.2); // the deck edge rises toward the bow
const boatDeck = (z) => boatSheer(z) - 0.24; // the deck sits a little below the edge, inside a low bulwark

// Teak planking for the deck, drawn once onto a small canvas
function teakTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  if (!g || !g.fillRect) return null;
  for (let i = 0; i < 16; i++) {
    const tone = 150 + Math.floor(Math.random() * 30);
    g.fillStyle = `rgb(${tone}, ${Math.floor(tone * 0.68)}, ${Math.floor(tone * 0.42)})`;
    g.fillRect(i * 16, 0, 16, 256);
    g.fillStyle = "rgba(40, 28, 18, 0.9)"; // caulked seam
    g.fillRect(i * 16, 0, 2, 256);
    const joint = Math.floor(Math.random() * 256);
    g.fillRect(i * 16, joint, 16, 2); // butt joint
    for (let k = 0; k < 6; k++) {
      g.fillStyle = `rgba(90, 60, 35, ${0.1 + Math.random() * 0.15})`; // grain
      g.fillRect(i * 16 + 3 + Math.random() * 11, 0, 1, 256);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function buildBoat() {
  const root = new THREE.Group();
  const tilt = new THREE.Group();
  root.add(tilt);
  const STATIONS = 26;
  const zAt = (i) => BOAT_LEN.stern + ((BOAT_LEN.bow - BOAT_LEN.stern) * i) / (STATIONS - 1);

  // --- Hull: cross-sections from the stern to the bow, lofted into one surface ---
  const section = (z) => {
    const t = boatT(z);
    const w = Math.max(boatHalfBeam(z), 0.02);
    const s = boatSheer(z);
    const keel = lerp(-0.78, -0.05, smooth(0.62, 1, t)); // the forefoot sweeps up into the stem
    const chine = lerp(-0.05, 0.35, smooth(0.5, 1, t));
    // keel → chine → flared topsides → sheer (one side)
    return [
      [0, keel],
      [0.5 * w, lerp(keel, chine, 0.6)],
      [0.92 * w, chine],
      [1.0 * w, chine + 0.28],
      [1.04 * w, (chine + 0.28 + s) / 2],
      [1.07 * w, s],
    ];
  };
  const hullPos = [];
  const hullCol = [];
  const white = [0.95, 0.95, 0.93];
  const navy = [0.1, 0.17, 0.3];
  const bottom = [0.55, 0.16, 0.14];
  const colorAt = (y) => (y < -0.06 ? bottom : y < 0.22 ? navy : white);
  const ring = []; // per station: points from the port sheer, round the keel, to the starboard sheer
  for (let i = 0; i < STATIONS; i++) {
    const z = zAt(i);
    const half = section(z);
    const pts = [...half.slice().reverse().map(([x, y]) => [-x, y]), ...half.slice(1)];
    ring.push(pts.map(([x, y]) => [x, y, z]));
  }
  const P = ring[0].length;
  const idx = [];
  ring.forEach((pts) => pts.forEach(([x, y, z]) => (hullPos.push(x, y, z), hullCol.push(...colorAt(y)))));
  for (let i = 0; i < STATIONS - 1; i++)
    for (let j = 0; j < P - 1; j++) {
      const a = i * P + j;
      idx.push(a, a + P, a + 1, a + 1, a + P, a + P + 1);
    }
  // Transom: close off the stern
  const tc = hullPos.length / 3;
  hullPos.push(0, (ring[0][0][1] + ring[0][P >> 1][1]) / 2, BOAT_LEN.stern);
  hullCol.push(...white);
  for (let j = 0; j < P - 1; j++) idx.push(tc, j + 1, j);
  idx.push(tc, 0, P - 1); // the top of the transom, between the two gunwales
  const hullGeo = new THREE.BufferGeometry();
  hullGeo.setAttribute("position", new THREE.Float32BufferAttribute(hullPos, 3));
  hullGeo.setAttribute("color", new THREE.Float32BufferAttribute(hullCol, 3));
  hullGeo.setIndex(idx);
  hullGeo.computeVertexNormals();
  const hullMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.35, metalness: 0.05, side: THREE.DoubleSide });
  tilt.add(new THREE.Mesh(hullGeo, hullMat));

  // --- Deck: teak, gently crowned, inside the bulwark ---
  const deckPos = [];
  const deckUv = [];
  const deckIdx = [];
  for (let i = 0; i < STATIONS; i++) {
    const z = zAt(i);
    const w = Math.max(boatHalfBeam(z) * 1.02 - 0.05, 0.01);
    const y = boatDeck(z);
    for (const [x, dy] of [[-w, 0], [0, 0.05], [w, 0]]) {
      deckPos.push(x, y + dy, z);
      deckUv.push(x / 2.2, z / 2.2);
    }
  }
  for (let i = 0; i < STATIONS - 1; i++)
    for (let j = 0; j < 2; j++) {
      const a = i * 3 + j;
      deckIdx.push(a, a + 1, a + 3, a + 1, a + 4, a + 3);
    }
  const deckGeo = new THREE.BufferGeometry();
  deckGeo.setAttribute("position", new THREE.Float32BufferAttribute(deckPos, 3));
  deckGeo.setAttribute("uv", new THREE.Float32BufferAttribute(deckUv, 2));
  deckGeo.setIndex(deckIdx);
  deckGeo.computeVertexNormals();
  const teak = teakTexture();
  const deckMat = new THREE.MeshStandardMaterial({ color: teak ? 0xffffff : 0xa47449, map: teak, roughness: 0.75, side: THREE.DoubleSide });
  tilt.add(new THREE.Mesh(deckGeo, deckMat));

  // --- Gunwale rub rails along the sheer ---
  const steel = new THREE.MeshStandardMaterial({ color: 0xd8dde2, roughness: 0.18, metalness: 0.9 });
  const rubMat = new THREE.MeshStandardMaterial({ color: 0x3a3d42, roughness: 0.5 });
  for (const side of [-1, 1]) {
    const pts = [];
    for (let i = 0; i < STATIONS; i++) {
      const z = zAt(i);
      pts.push(new THREE.Vector3(side * Math.max(boatHalfBeam(z), 0.02) * 1.07, boatSheer(z), z));
    }
    tilt.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 60, 0.06, 6, false), rubMat));
  }

  // --- Bow railings: top and middle rails, stanchions, and the pulpit at the bow ---
  const railFrom = -0.4;
  const railTo = BOAT_LEN.bow + 0.35;
  const railPoint = (side, z, h) => {
    const w = Math.max(boatHalfBeam(z) * 1.0 - 0.1, 0.05);
    return new THREE.Vector3(side * w, boatSheer(z) + h, z);
  };
  for (const h of [0.68, 0.36]) {
    const pts = [];
    for (let k = 0; k <= 20; k++) pts.push(railPoint(-1, lerp(railFrom, railTo, k / 20), h));
    for (let k = 20; k >= 0; k--) pts.push(railPoint(1, lerp(railFrom, railTo, k / 20), h));
    tilt.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 90, 0.025, 6, false), steel));
  }
  for (let z = railFrom; z > railTo; z -= 0.9) {
    for (const side of [-1, 1]) {
      const top = railPoint(side, z, 0.68);
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.025, 0.68 + 0.22, 6), steel);
      post.position.set(top.x, top.y - (0.68 + 0.22) / 2, top.z);
      tilt.add(post);
    }
  }

  // --- Foredeck fittings: anchor locker hatch, anchor on the bow roller, cleats ---
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x2b2e33, roughness: 0.6, metalness: 0.4 });
  const hatch = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.05, 0.6), new THREE.MeshStandardMaterial({ color: 0xe9e8e2, roughness: 0.4 }));
  hatch.position.set(0, boatDeck(-3.3) + 0.07, -3.3);
  tilt.add(hatch);
  const roller = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.12, 0.7), steel);
  roller.position.set(0, boatSheer(-4.3) + 0.04, -4.35);
  tilt.add(roller);
  const anchor = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.08, 0.32), darkMat);
  anchor.position.set(0, boatSheer(-4.55) - 0.05, -4.62);
  tilt.add(anchor);
  for (const [x, z] of [[-0.75, -1.2], [0.75, -1.2], [-0.35, -3.95], [0.35, -3.95], [-1.25, 3.3], [1.25, 3.3]]) {
    const cleat = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.26), steel);
    cleat.position.set(x * Math.min(1, boatHalfBeam(z) / 1.45 + 0.1), boatDeck(z) + 0.06, z);
    tilt.add(cleat);
  }

  // --- Cabin: raked windshield, side windows, a roof that overhangs a little ---

    }
    moor.ready = true;
  }
  boat.root.position.set(bx, moor.y, bz);
  boat.root.rotation.y = yaw;
  boat.tilt.rotation.set(moor.pitch, 0, moor.roll);
  // lights come on at dusk and in dark weather
  boat.lampLight.intensity = 1.5 * lampsOn;
  boat.lampMat.emissiveIntensity = 2 * lampsOn;
  boat.windowMat.emissiveIntensity = 0.8 * lampsOn;
  for (const nav of boat.navLights) {
    nav.mat.emissiveIntensity = 2 * lampsOn;
    nav.glow.material.opacity = lampsOn;
  }
  dock.bulbMat.emissiveIntensity = 2.2 * lampsOn;
  dock.dockLight.intensity = 1.4 * lampsOn;
  for (const l of dock.lamps) l.glow.material.opacity = lampsOn * 0.9, l.glow.scale.setScalar(0.5 + 1.6 * lampsOn);
  // ropes from the boat's cleats to the dock's piles
  boat.root.updateMatrixWorld(true);
  for (const r of moor.free ? [] : moor.ropes) {
    _mb.set(-boatHalfBeam(r.lz) * 0.85, boatDeck(r.lz) + 0.06, r.lz);
    boat.tilt.localToWorld(_mb);
    const s = DOCK.r0 + (DOCK.r1 - DOCK.r0) * 0.72 + (r.lz < 0 ? -r.lz * 0.5 : -r.lz * 0.9);
    _md.set(ISL.x + DOCK.nx * s + DOCK.nz * 1.0, DOCK.y + 0.1, ISL.z + DOCK.nz * s - DOCK.nx * 1.0);
    const len = _mb.distanceTo(_md);
    r.m.position.copy(_mb).add(_md).multiplyScalar(0.5);
    r.m.scale.set(1, len, 1);
    r.m.quaternion.setFromUnitVectors(_pa.set(0, 1, 0), _pn.copy(_md).sub(_mb).normalize());
  }
}
// Where you can stand: the dock, and the boat's open deck (the cabin is solid)
function dockHeightAt(x, z) {
  const dx = x - ISL.x, dz = z - ISL.z;
  const s = dx * DOCK.nx + dz * DOCK.nz;
  const l = -dx * DOCK.nz + dz * DOCK.nx;
  return s > DOCK.r0 && s < DOCK.r1 && l > -1.1 && l < 1.45 ? DOCK.y : null; // (the strip beside it is the gap to the boat)
}
function boatDeckAt(x, z) {
  const dx = x - moor.wx, dz = z - moor.wz;
  const c = Math.cos(moor.wyaw), sn = Math.sin(moor.wyaw);
  const lx = dx * c - dz * sn, lz = dx * sn + dz * c;
  if (lz < BOAT_LEN.bow + 0.5 || lz > BOAT_LEN.stern - 0.3) return null;
  if (Math.abs(lx) > boatHalfBeam(lz) - 0.2) return null;
  if (lz > -0.75 && lz < 1.95 && Math.abs(lx) < 1.2) return "cabin";
  return moor.y + boatDeck(lz) + 0.05;
}

// Brush-stroke wishes, painted in red ink on the paper
function brushWish(ctx, cx, cy, size, rgba) {
  ctx.strokeStyle = rgba;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  for (let k = 0; k < 8; k++) {
    ctx.lineWidth = size * rand(0.05, 0.12);
    ctx.beginPath();
    const x0 = cx + rand(-0.5, 0.5) * size, y0 = cy + rand(-0.5, 0.5) * size;
    ctx.moveTo(x0, y0);
    ctx.bezierCurveTo(x0 + rand(-0.5, 0.5) * size, y0 + rand(-0.5, 0.5) * size, cx + rand(-0.5, 0.5) * size, cy + rand(-0.5, 0.5) * size, cx + rand(-0.5, 0.5) * size, cy + rand(-0.5, 0.5) * size);
    ctx.stroke();
  }
}

function launchSky(l, anywhere) {

function updateSky(dt, t, lampsOn) {
  const wdx = Math.cos(weather.windAngle), wdz = Math.sin(weather.windAngle);
  const drift = 1.2 + 4.5 * (weather.windSpeed / 24);
  skyMat.color.setRGB(lerp(0.9, 1.8, lampsOn), lerp(0.85, 1.05, lampsOn), lerp(0.8, 0.5, lampsOn));
  skyGlowMat.opacity = 0.2 + 0.6 * lampsOn;

    l.y += l.vy * dt * (1 + 0.15 * Math.sin(t * 0.6 + l.phase));

    dummy.rotation.set(Math.sin(t * 0.9 + l.phase) * 0.06, t * l.spin + l.phase, Math.cos(t * 0.8 + l.phase) * 0.06);
    dummy.scale.setScalar(Math.max(s, 0.001));

    const flick = 1 + 0.12 * Math.sin(t * 9 + l.phase * 5) + 0.06 * Math.sin(t * 17 + l.phase);

function placeLotus(l, first) {
  const a = Math.PI / 2 + rand(-1.15, 1.15);
  const d = first ? rand(6, 110) : rand(70, 115);
  l.x = ISL.x + Math.cos(a) * (ISL.r + d);

function updateLotus(dt, t, lampsOn) {
  const drift = 0.22 + 0.55 * weather.value;
  candleMat.color.setRGB(lerp(0.75, 1.9, lampsOn), lerp(0.62, 1.1, lampsOn), lerp(0.45, 0.5, lampsOn));

  for (const l of lotuses) {
    l.wander += dt * 0.25;
    const toC = Math.atan2(ISL.z - l.z, ISL.x - l.x); // the tide carries them shoreward
    l.x += (Math.cos(toC) * drift * l.speed + Math.cos(l.wander) * 0.12) * dt;
    l.z += (Math.sin(toC) * drift * l.speed + Math.sin(l.wander * 1.3) * 0.12) * dt;

    const h = waveHeight(l.x, l.z, t);
    const hx = waveHeight(l.x + 0.4, l.z, t) - waveHeight(l.x - 0.4, l.z, t);
    const hz = waveHeight(l.x, l.z + 0.4, t) - waveHeight(l.x, l.z - 0.4, t);

    l.sprite.scale.setScalar((0.5 + 1.8 * lampsOn) * (1 + 0.1 * Math.sin(t * 8 + l.phase)));

}

  if (near) pin(near.x, near.z, ["", "T", "V", "R", "S", "C", "A"][near.type], "#f2c14e");
  // the boat
  if (moor.ready) {
    const [px, py] = toMap(moor.wx, moor.wz);
    mmx.save();
    mmx.translate(px, py);
    mmx.rotate(-moor.wyaw);
    mmx.fillStyle = boatDrive.on ? "#ffffff" : "#bfe6ff";
    mmx.beginPath();
    mmx.moveTo(0, -7); mmx.lineTo(4.5, 6); mmx.lineTo(-4.5, 6);
    mmx.closePath();
    mmx.fill();
    mmx.restore();
  }
  // you: a bright arrow with a dark halo, pointing the way you face
  mmx.save();
  mmx.translate(c, c);
  mmx.fillStyle = "rgba(4,16,24,0.55)";
  mmx.beginPath();
  mmx.arc(0, 0, 17, 0, 6.2832);
  mmx.fill();
  mmx.rotate(Math.atan2(camFwd.x, -camFwd.z));
  mmx.fillStyle = "#ff5a3c";
  mmx.strokeStyle = "#ffffff";
  mmx.lineJoin = "round";
  mmx.lineWidth = 3;
  mmx.beginPath();
  mmx.moveTo(0, -15); mmx.lineTo(10.5, 12); mmx.lineTo(0, 6.5); mmx.lineTo(-10.5, 12);
  mmx.closePath();
  mmx.stroke();
  mmx.fill();
  mmx.restore();
  mmx.restore();
  mmx.strokeStyle = "rgba(255,255,255,0.7)";
  mmx.lineWidth = 3;
  mmx.beginPath();
  mmx.arc(c, c, Rr, 0, 6.2832);
  mmx.stroke();
  const pill = (txt, y, color, size) => {
    mmx.font = `bold ${size}px system-ui, sans-serif`;
    mmx.textAlign = "center";
    mmx.textBaseline = "middle";
    const w = mmx.measureText(txt).width + 16, h = size + 9;
    mmx.fillStyle = "rgba(4,16,24,0.82)";
    mmx.beginPath();
    mmx.roundRect ? mmx.roundRect(c - w / 2, y - h / 2, w, h, h / 2) : mmx.rect(c - w / 2, y - h / 2, w, h);
    mmx.fill();
    mmx.fillStyle = color;
    mmx.fillText(txt, c, y + 1);
  };
  pill("N", 17, "#ffffff", 15);
  if (near) {
    const d = Math.round(Math.hypot(near.x - cx, near.z - cz) - near.r);
    const dirs = ["E", "SE", "S", "SW", "W", "NW", "N", "NE"];
    const dir = dirs[(Math.round(Math.atan2(near.z - cz, near.x - cx) / 0.7854) + 8) % 8];
    pill(`${ISLE_NAMES[near.type]} · ${d > 999 ? (d / 1000).toFixed(1) + " km" : d + " m"} ${dir}`, c + Rr * 0.6, "#ffd98a", 14);
  }
  pill(range >= 1000 ? (range / 1000).toFixed(1) + " km" : range + " m", c + Rr * 0.8, "#cfe6ea", 12);
  mapTex.needsUpdate = true;
}
function updateMinimap(dt) {
  mapTimer -= dt;
  const range = MAP_RANGES[opts.map][1];
  mapDom.style.display = range && !renderer.xr.isPresenting ? "block" : "none";
  mapPanel.visible = !!range && renderer.xr.isPresenting && !menu.open;
  if (!range || mapTimer > 0) return;
  mapTimer = renderer.xr.isPresenting ? 0.25 : 0.12;
  drawMinimap();
  if (!renderer.xr.isPresenting) {
    const g = mapDom.getContext("2d");
    g.clearRect(0, 0, mapDom.width, mapDom.height);
    g.drawImage(mapCanvas, 0, 0, mapDom.width, mapDom.height);
  }
}
addEventListener("keydown", (e) => {
  if (e.code === "KeyM" && !e.repeat) {
    opts.map = (opts.map + 1) % MAP_RANGES.length;
    applyOpts();
    flashHint("Map: " + MAP_RANGES[opts.map][0]);
  }
});

// ===== Frame loop: a full day and night in eight minutes =====
const DAY_SECONDS = 480;
const game = { hours: rand(0, 24), speed: 1 }; // a random time of day each visit
let prevHours = game.hours;
let last = performance.now();
function frame(now) {
  samplePerf((now - last) / 1000);
  const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
  last = now;
  shared.uTime.value += dt;
  const t = shared.uTime.value;
  game.hours = (game.hours + (dt * 24 * game.speed) / DAY_SECONDS) % 24;
  if (prevHours < 5 && game.hours >= 5 && !weather.locked) {
    weather.fogDay = Math.random() < 0.3; // each new morning may bring a fog day
    weather.fogTimer = 0;
  }
  prevHours = game.hours;

  updateWeather(dt);
  windU.uWind.value.set(Math.cos(weather.windAngle), Math.sin(weather.windAngle));
  windU.uWindStr.value += (clamp(weather.windSpeed / 24, 0, 1) - windU.uWindStr.value) * (1 - Math.exp(-dt));
  const env = applyEnvironment(game.hours);
  updateIslUniforms(camPos.x, camPos.z);
  checkBoatKey();
  updateBoatMoor(dt, t, env.lampsOn); // (before the player, so people aboard are carried with it)
  audio.engine(boatDrive.on ? clamp(Math.abs(moor.speed) / (BOAT_MAX0 * BOAT_SPEEDS[opts.boatSpd][1]) + 0.25 * Math.abs(boatDrive.throttle), 0, 1) : 0);
  updatePlayer(dt);
  rig.updateMatrixWorld(true);
  camera.getWorldPosition(camPos);
  {
    // under the water? (a little hysteresis so the surface doesn't flicker)
    const sh = waveHeight(camPos.x, camPos.z, t);
    const u = camPos.y < sh + (player.under ? 0.03 : -0.03) && player.waterSm - groundY(player.x, player.z) > 0.4;
    if (u !== player.under) {
      player.under = u;
      audio.underwater(u);
      if (!u) splash(camPos.x, sh, camPos.z, 8, 1.6);
    }
    shared.uUnder.value = u ? 1 : 0;
    water.renderOrder = u ? -5 : 1; // from below the surface is drawn first, so it hides what is above it
    water.material.depthWrite = u;
    sky.visible = !u;
    farOcean.visible = !u && camPos.y <= 150; // (above that, the planet's own sea, traced in updateSpace, stands in for it)
    foamLayer.visible = !u;
    if (u) {
      shared.uUnderCol.value.setRGB(0.03, 0.3, 0.36).multiplyScalar(0.12 + 0.88 * clamp(shared.uLightLevel.value, 0, 1));
      scene.fog.color.copy(shared.uUnderCol.value);
      scene.fog.near = 0.5;
      scene.fog.far = 48;
      landUniforms.uFogN.value = 0.5;
      landUniforms.uFogF.value = 48;
      renderer.setClearColor(shared.uUnderCol.value);
    }
  }
  updateSpace(dt);
  if (camPos.y < 2500) skyCache.update(camPos);
  updateWorld(dt, t, env.lampsOn);
  seaLife.update(t, dt, env.lampsOn, env.light);
  updateMinimap(dt);

  if (opts.festival) {
    updateSky(dt, t, env.lampsOn);
    updateLotus(dt, t, env.lampsOn);
  }
  updateReef();
  updateReefFish(dt, t);
  updateLeapFish(dt, t);
  updateSplashes(dt);
  if (opts.festival) garland.update(t, env.lampsOn);
  fire.update(dt, t);
  updateLamps(env.lampsOn);
  updateProps(dt);
  updateMenu(dt);
  updateFireworks(dt);
  updateDrone(dt, t);
  updateDroneView(dt);
  updateImprint(dt);
  updateLighthouse(dt, env.lampsOn);
  updateRain(dt, env.lightLevel);
  if (player.under) rain.visible = false;
  audio.update(weather.value, wx.rain, waveScale, Math.abs(shoreDistAll(player.x, player.z)));

  // Everything big follows the camera, so the sea, sky and horizon are always centred on you
  water.position.set(Math.round(camPos.x / WATER_STEP) * WATER_STEP, 0, Math.round(camPos.z / WATER_STEP) * WATER_STEP);
  farOcean.position.set(camPos.x, 0, camPos.z);
  sky.position.copy(camPos);
  waterUniforms.uCamPos.value.copy(camPos);

  const vm = vignette.material;
  vm.opacity += (vigWant - vm.opacity) * (1 - Math.exp(-dt * 6));
  vignette.visible = vm.opacity > 0.02;
  screenFade = Math.max(0, screenFade - dt * 1.8);
  fadeQuad.material.opacity = screenFade;
  fadeQuad.visible = screenFade > 0.01;
  renderer.render(scene, camera);
  drawPip();
}

// ===== Entering VR, sound, resize =====
const startAudio = () => audio.start();
addEventListener("pointerdown", startAudio, { once: true });
addEventListener("keydown", startAudio, { once: true });
setTimeout(() => ($("hint").style.opacity = 0), 16000);
if (!navigator.xr) {
  $("vr").textContent = window.isSecureContext ? "VR not available in this browser" : "VR needs https";
  $("vr").style.opacity = 0.6;
} else {
  navigator.xr.isSessionSupported("immersive-vr").then((ok) => {
    if (!ok) {
      $("vr").textContent = "No VR headset found";
      $("vr").style.opacity = 0.6;
    }
  }).catch(() => {});
}
$("vr").onclick = async () => {
  try {
    startAudio();
    const session = await navigator.xr.requestSession("immersive-vr", { optionalFeatures: ["local-floor"] });
    await renderer.xr.setSession(session);
    $("vr").hidden = true;
    $("hint").style.opacity = 0;
    session.addEventListener("end", () => {
      camera.position.set(0, 1.65, 0);
      camera.quaternion.identity();
      pitch = 0;
      $("vr").hidden = false;
    });
  } catch (e) {
    $("vr").textContent = "VR unavailable: " + e.message;
  }
};
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(frame);
// handy for testing in a desktop browser
