<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vrsurf</title>
<style>
:root{color-scheme:dark;--ink:#f2f7f6;--go:#ffcf5a;--go-ink:#2a1d00;--card:rgba(6,24,34,.62)}
html,body{margin:0;height:100%;background:#06202c;color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
canvas{display:block}
#hud{position:fixed;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none;font-weight:600;text-shadow:0 1px 4px #0008}
#hud span{background:var(--card);padding:6px 12px;border-radius:999px}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(#0b3a4d99,#031018cc)}
#menu .box{background:var(--card);backdrop-filter:blur(8px);border:1px solid #ffffff22;border-radius:18px;padding:28px 32px;max-width:420px;margin:16px;text-align:center}
h1{margin:0 0 6px;font-size:44px;letter-spacing:.02em}
p{margin:8px 0;line-height:1.45;opacity:.9}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 26px;margin:8px 6px 0;background:var(--go);color:var(--go-ink);cursor:pointer}
button.alt{background:#ffffff22;color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
#touch{position:fixed;bottom:0;left:0;right:0;height:35%;display:none}
</style>
</head>
<body>
<div id="hud" hidden><span id="score">0</span><span id="info"></span></div>
<div id="menu"><div class="box">
  <h1>Vrsurf</h1>
  <p id="msg">Ride the wave. Carve between rocks, grab the golden rings, and keep your speed up.</p>
  <p style="font-size:13px;opacity:.7">Steer: ← → / A D, drag or tilt on touch.<br>VR: lean your head or hold the controllers left/right.</p>
  <button id="play">Surf</button><button id="vr" class="alt" disabled>Enter VR</button>
</div></div>
<div id="touch"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const SKY=0x7fc8e8;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,40,170);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,400);
const rig=new THREE.Group(); rig.add(camera); scene.add(rig);

scene.add(new THREE.HemisphereLight(0xcfeeff,0x1a5a70,.9));
const sun=new THREE.DirectionalLight(0xfff2d0,.9); sun.position.set(-30,40,-20); scene.add(sun);

// Sun disc
const sunDisc=new THREE.Mesh(new THREE.CircleGeometry(14,32),new THREE.MeshBasicMaterial({color:0xfff0b0,fog:false}));
sunDisc.position.set(-60,45,-200); scene.add(sunDisc);

// Water: big plane, vertices animated into rolling swells
const WSEG=90, WSIZE=220;
const wgeo=new THREE.PlaneGeometry(WSIZE,WSIZE,WSEG,WSEG); wgeo.rotateX(-Math.PI/2);
const wmat=new THREE.MeshStandardMaterial({color:0x138cb0,roughness:.35,metalness:.1,flatShading:true});
const water=new THREE.Mesh(wgeo,wmat); scene.add(water);
const wpos=wgeo.attributes.position;
let dist=0, x=0; // distance travelled
function waveH(x,z){ // z is world z; world scrolls so use travelled-dist-adjusted z
  const w=z-dist;
  return Math.sin(x*.12+w*.05)*1.2 + Math.sin(w*.11+x*.03)*.8 + Math.sin(x*.3-w*.2)*.25;
}
// Wave face: a swell that rises on the left; surfer rides across the face
function updateWater(tt){
  const px=wpos.array, ox=x;
  for(let i=0;i<wpos.count;i++){
    const lx=px[i*3], lz=px[i*3+2];
    px[i*3+1]=waveH(lx+ox,lz)+Math.sin(tt*1.2+(lx+ox)*.2)*.15;
  }
  wpos.needsUpdate=true; wgeo.computeVertexNormals();
}

// Surfer: board + simple person
const surfer=new THREE.Group();
const board=new THREE.Mesh(new THREE.BoxGeometry(.7,.12,2.4),new THREE.MeshStandardMaterial({color:0xff5a4a}));
board.geometry.translate(0,0,0);
const stripe=new THREE.Mesh(new THREE.BoxGeometry(.2,.13,2.42),new THREE.MeshStandardMaterial({color:0xffffff}));
const body=new THREE.Mesh(new THREE.CylinderGeometry(.2,.26,1.1,8),new THREE.MeshStandardMaterial({color:0x222c44}));
body.position.y=.85;
const head=new THREE.Mesh(new THREE.SphereGeometry(.2,12,12),new THREE.MeshStandardMaterial({color:0xe8b08a}));
head.position.y=1.55;
surfer.add(board,stripe,body,head); scene.add(surfer);

// Obstacles & rings
const rocks=[], rings=[];
const rockGeo=new THREE.DodecahedronGeometry(1,0), rockMat=new THREE.MeshStandardMaterial({color:0x4b4f55,flatShading:true});
const ringGeo=new THREE.TorusGeometry(1.1,.18,8,24), ringMat=new THREE.MeshStandardMaterial({color:0xffcf5a,emissive:0xaa7a00,emissiveIntensity:.6});
const LANE=14; // half width of playable water
const SPAWN=-150;
function spawn(){
  const x=(Math.random()*2-1)*LANE;
  if(Math.random()<.62){
    const r=new THREE.Mesh(rockGeo,rockMat); const s=.9+Math.random()*1.3;
    r.scale.set(s,s*.8,s); r.position.set(x,0,SPAWN); r.userData.r=s*.85; scene.add(r); rocks.push(r);
  }else{
    const r=new THREE.Mesh(ringGeo,ringMat); r.position.set(x,1.4,SPAWN); scene.add(r); rings.push(r);
  }
}

// Spray particles
const SP=120, sprayGeo=new THREE.BufferGeometry();
const sprayPos=new Float32Array(SP*3), sprayVel=new Float32Array(SP*3), sprayLife=new Float32Array(SP);
sprayGeo.setAttribute('position',new THREE.BufferAttribute(sprayPos,3));
const spray=new THREE.Points(sprayGeo,new THREE.PointsMaterial({color:0xffffff,size:.25,transparent:true,opacity:.8}));
spray.frustumCulled=false; scene.add(spray);
let sprayI=0;
function emit(x,y,z,n,power){
  for(let k=0;k<n;k++){
    const i=sprayI++%SP;
    sprayPos.set([x,y,z],i*3);
    sprayVel.set([(Math.random()-.5)*power,Math.random()*power*.8,(Math.random()-.2)*power],i*3);
    sprayLife[i]=1;
  }
}

// State
let state='menu', vx=0, speed=22, score=0, lives=3, steerKey=0, steerTouch=0, tilt=0, t=0, spawnT=0, invuln=0;
const keys={};
addEventListener('keydown',e=>{keys[e.key]=true; if(state==='menu'&&(e.key===' '||e.key==='Enter'))start();});
addEventListener('keyup',e=>keys[e.key]=false);
// touch: drag horizontally relative to screen centre
function touchSteer(e){const t0=e.touches[0]; steerTouch=t0?((t0.clientX/innerWidth)*2-1):0;}
addEventListener('touchstart',touchSteer,{passive:true});
addEventListener('touchmove',touchSteer,{passive:true});
addEventListener('touchend',()=>steerTouch=0);
addEventListener('deviceorientation',e=>{if(e.gamma!=null)tilt=Math.max(-1,Math.min(1,e.gamma/30));});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// VR controllers
const ctrls=[0,1].map(i=>{const c=renderer.xr.getController(i); rig.add(c); return c;});
function vrSteer(){
  if(!renderer.xr.isPresenting) return 0;
  let s=camera.position.x*2.5; // head lean
  const cx=ctrls.map(c=>c.position.x); s+= (cx[0]+cx[1])/2*1.5;
  return Math.max(-1,Math.min(1,s));
}

function reset(){
  [...rocks,...rings].forEach(o=>scene.remove(o)); rocks.length=rings.length=0;
  x=0;vx=0;speed=22;score=0;lives=3;dist=0;spawnT=0;invuln=0;
}
function start(){
  reset(); state='play'; $('menu').style.display='none'; $('hud').hidden=false;
  if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(()=>{});
}
function gameOver(){
  state='menu'; $('menu').style.display='flex';
  $('msg').textContent=`Wiped out! Score ${Math.floor(score)}. Ride again?`;
  $('play').textContent='Surf again';
  if(renderer.xr.isPresenting) renderer.xr.getSession().end();
}
$('play').onclick=start;

// WebXR button
if(navigator.xr){
  navigator.xr.isSessionSupported('immersive-vr').then(ok=>{ if(ok) $('vr').disabled=false; else $('vr').title='VR not supported on this device'; }).catch(()=>{});
}
$('vr').onclick=async()=>{
  try{
    const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});
    await renderer.xr.setSession(session);
    start();
  }catch(e){ $('msg').textContent='Could not start VR: '+e.message; }
};

function step(dt){
  t+=dt;
  if(state==='play'){
    let s=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0);
    s+=steerTouch+tilt*.8+vrSteer();
    s=Math.max(-1,Math.min(1,s));
    vx+=(s*18-vx)*Math.min(1,dt*4);
    x=Math.max(-LANE-3,Math.min(LANE+3,x+vx*dt));
    speed+=dt*.35; dist+=speed*dt; score+=speed*dt*.1;
    invuln=Math.max(0,invuln-dt);
    spawnT-=dt; if(spawnT<=0){spawn(); spawnT=Math.max(.25,1.0-speed*.012)*(.6+Math.random()*.6);}
    for(const arr of [rocks,rings]) for(let i=arr.length-1;i>=0;i--){
      const o=arr[i]; o.position.z+=speed*dt; o.position.y=waveH(o.position.x,o.position.z)+(arr===rings?1.6:.2);
      if(arr===rings) o.rotation.y+=dt*3;
      const dz=o.position.z, dx=o.position.x-x;
      if(arr===rocks && Math.abs(dz)<1.4 && Math.abs(dx)<o.userData.r+.5 && !invuln){
        lives--; invuln=1.5; vx=-Math.sign(dx||1)*10; emit(x,.5,0,40,9);
        if(lives<=0){gameOver();}
      }
      if(arr===rings && Math.abs(dz)<1.3 && Math.abs(dx)<1.6){
        score+=50; emit(o.position.x,1.4,0,25,6); scene.remove(o); arr.splice(i,1); continue;
      }
      if(dz>12){scene.remove(o); arr.splice(i,1);}
    }
    if(Math.random()<.6) emit(x+(Math.random()-.5)*.8,.1,1.1,1,3);
    $('score').textContent=Math.floor(score);
    $('info').textContent='♥'.repeat(lives)+'  '+Math.round(speed*1.8)+' km/h';
  }else{
    x=Math.sin(t*.5)*6; vx=Math.cos(t*.5)*3; dist+=12*dt;
  }
  updateWater(t);
  // surfer rides the swell
  const gy=waveH(x,0)+Math.sin(t*1.2+x*.2)*.15;
  const gy2=waveH(x+1,0), gy3=waveH(x-1,0);
  surfer.position.set(x,gy+.1,0);
  surfer.rotation.z=-(gy2-gy3)*.25-vx*.02;
  surfer.rotation.y=-vx*.015;
  body.rotation.z=-vx*.02;
  surfer.visible=!(invuln>0&&Math.floor(t*14)%2);
  water.position.x=x; // keep the plane centred under the surfer; waveH uses world x so shift verts
  // camera: behind and above surfer
  if(renderer.xr.isPresenting){ rig.position.set(x,gy+.2,2.2); rig.rotation.set(0,0,0); }
  else{
    rig.position.set(x*.6,gy+3.2,9); camera.lookAt(x*.6,gy+1,-12);
    rig.rotation.set(0,0,0);
  }
  // spray
  for(let i=0;i<SP;i++) if(sprayLife[i]>0){
    sprayLife[i]-=dt*1.4;
    sprayVel[i*3+1]-=18*dt;
    sprayPos[i*3]+=sprayVel[i*3]*dt; sprayPos[i*3+1]+=sprayVel[i*3+1]*dt; sprayPos[i*3+2]+=sprayVel[i*3+2]*dt+speed*dt*.3;
    if(sprayLife[i]<=0) sprayPos[i*3+1]=-50;
  }
  sprayGeo.attributes.position.needsUpdate=true;
}

let last=performance.now();
renderer.setAnimationLoop(()=>{
  const now=performance.now(), dt=Math.min(.05,(now-last)/1000); last=now;
  step(dt); renderer.render(scene,camera);
});
})();
</script>
</body>
</html>
